<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Zoom, tune and redraw 21 classic fractals in your browser, including a Mandelbrot deep zoom to about 10^30x.">
<title>Fractal Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an observatory bench — catalog | live canvas | instrument panel; stacks to one column on phones.
   Deliberately single dark theme: fractal renders read best on a dark stage. */
:root {
  --ink: #0c0e15;
  --stage: #06070b;
  --panel: #131622;
  --line: #262b3d;
  --fg: #e9e5d9;
  --muted: #8c91a6;
  --brass: #dcaa4a;
  --brass-soft: rgba(220, 170, 74, 0.14);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 336px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header h1 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; margin: 0; }
header h1 span { color: var(--brass); }
header p { margin: 0; color: var(--muted); }

/* Catalog */
.catalog { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding-right: 4px; }
.group { display: flex; flex-direction: column; gap: 2px; }
.group h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 10px; }
.item {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  background: none; border: 0; border-radius: 6px; padding: 6px 10px; text-align: left; cursor: pointer; color: var(--fg);
}
.item:hover { background: var(--panel); }
.item .d { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item[aria-current="true"] { background: var(--brass-soft); color: var(--brass); }
.item[aria-current="true"] .d { color: var(--brass); }

/* Stage */
.stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--stage); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage canvas.pan { cursor: grab; }
#snap { pointer-events: none; transform-origin: 50% 50%; }
.locate { display: flex; gap: 6px; }
.locate input { flex: 1; min-width: 0; }
.stage canvas.pan:active { cursor: grabbing; }
.overlay { position: absolute; font-family: var(--mono); font-size: 11.5px; color: var(--fg); background: rgba(6, 7, 11, 0.72); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; pointer-events: none; font-variant-numeric: tabular-nums; }
#readout { left: 10px; bottom: 10px; max-width: calc(100% - 20px); }
.stage.has-mini #readout { max-width: calc(100% - 220px); }
@media (max-width: 900px) { .stage.has-mini #readout { max-width: calc(100% - 160px); } }
#hint { right: 10px; top: 10px; color: var(--muted); }
#note { left: 10px; top: 10px; color: var(--brass); }
.mini { position: absolute; right: 10px; bottom: 10px; width: 188px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--stage); cursor: pointer; padding: 0; }
.mini canvas { position: static; width: 100%; height: auto; aspect-ratio: 1; }
.mini span { display: block; font-family: var(--mono); font-size: 11px; padding: 4px 8px; color: var(--muted); text-align: left; border-top: 1px solid var(--line); }
.mini:hover span { color: var(--brass); }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

/* Panel */
.panel { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--brass); margin: 0; }
.card h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; margin: -6px 0 0; text-wrap: balance; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.facts dd.m { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.blurb { margin: 0; }
.tip { margin: 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.tip b { color: var(--fg); font-weight: 600; }
.card h4 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }

.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.ctl output { font-family: var(--mono); font-size: 12px; color: var(--brass); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--brass); margin: 2px 0; }
select, textarea, input[type="text"] { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea, input[type="text"] { font-family: var(--mono); font-size: 12.5px; }
textarea { resize: vertical; min-height: 64px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--brass); color: var(--brass); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: #1a1408; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: #1a1408; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--brass); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.sw { border: 1px solid var(--line); border-radius: 6px; padding: 0; cursor: pointer; overflow: hidden; background: var(--ink); text-align: left; }
.sw i { display: block; height: 16px; }
.sw span { display: block; font-size: 11px; padding: 2px 6px; color: var(--muted); }
.sw[aria-pressed="true"] { border-color: var(--brass); }
.sw[aria-pressed="true"] span { color: var(--brass); }
.small { font-size: 12px; color: var(--muted); margin: 0; }
.limits { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }
.limits li::marker { color: var(--brass); }
.ok { color: #8fd18b; }
.bad { color: #ee8a72; }
.linkish { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; color: var(--muted); cursor: pointer; font-size: 12.5px; }
.linkish:hover { color: var(--brass); border-color: var(--brass); }

@media (max-width: 1150px) {
  .app { grid-template-columns: 200px minmax(0, 1fr) 290px; }
}
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .catalog { flex-direction: row; overflow-x: auto; overflow-y: visible; gap: 6px; padding-bottom: 4px; }
  .group { flex-direction: row; gap: 4px; }
  .group h3 { display: none; }
  .item { white-space: nowrap; border: 1px solid var(--line); }
  .item .d { display: none; }
  .stage { height: 62vh; min-height: 320px; }
  .mini { width: 128px; }
  #hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Fractal <span>Atlas</span></h1>
    <p id="tagline">Zoom, tune and redraw the classic fractals.</p>
    <button class="linkish" id="perfLink">Performance &amp; limits</button>
  </header>
  <nav class="catalog" id="catalog" aria-label="Fractals"></nav>
  <main class="stage" id="stage">
    <canvas id="snap" aria-hidden="true"></canvas>
    <canvas id="gl2" class="pan" aria-label="Fractal render"></canvas>
    <canvas id="gl" class="pan" aria-label="Fractal render"></canvas>
    <canvas id="c2" aria-label="Fractal render"></canvas>
    <div class="overlay" id="note" hidden></div>
    <div class="overlay" id="hint" hidden>Click to glide in · click again to stop · drag to pan · scroll or pinch to zoom</div>
    <div class="overlay" id="readout"></div>
    <button class="mini" id="mini" hidden title="Open this Julia set">
      <canvas id="miniGl" width="256" height="256"></canvas>
      <span id="miniLabel">Julia preview</span>
    </button>
  </main>
  <aside class="panel">
    <section class="card" id="info"></section>
    <section class="card" id="controls"></section>
    <section class="card" id="look"></section>
    <section class="card" id="perf"></section>
  </aside>
</div>

<script>
// ---------- palettes (cosine gradients: a + b·cos(2π(c·t + d))) ----------
const PALETTES = {
  Ember:    [[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.1,.2]],
  Spectrum: [[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.33,.67]],
  Lichen:   [[.5,.5,.5],[.5,.5,.5],[1,1,.5],[.8,.9,.3]],
  Dusk:     [[.5,.5,.5],[.5,.5,.5],[1,.7,.4],[0,.15,.2]],
  Orchid:   [[.5,.5,.5],[.5,.5,.5],[2,1,0],[.5,.2,.25]],
  Clay:     [[.8,.5,.4],[.2,.4,.2],[2,1,1],[0,.25,.25]],
  Graphite: [[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,0,0]],
};
const G = { palette: 'Ember', shift: 0, glideSpeed: 1.3 };
try { const p = localStorage.getItem('fa-palette'); if (p && PALETTES[p]) G.palette = p; } catch (e) {}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
function palRGB(t, name = G.palette) {
  const [a, b, c, d] = PALETTES[name];
  return [0, 1, 2].map(i => clamp01(a[i] + b[i] * Math.cos(6.283185 * (c[i] * t + d[i]))));
}
const css = (rgb, k = 1) => `rgb(${rgb.map(v => Math.round(v * 255 * k)).join(',')})`;
const BG = [6, 7, 11];

// ---------- catalog ----------
const FR = [
  { id: 'mandelbrot', group: 'Escape-time', name: 'Mandelbrot set', kind: 'escape', type: 0, dim: '2',
    view: { cx: -0.6, cy: 0, w: 2.8 }, iter: 300,
    places: [['Whole set', -0.6, 0, 2.8], ['Seahorse Valley', -0.7463, 0.1102, 0.005], ['Elephant Valley', 0.2850, 0.0110, 0.012],
             ['Triple spiral', -0.0880, 0.6540, 0.01], ['Antenna mini-brot', -1.7549, 0, 0.04], ['Dendrite at c = i', 0, 1, 0.06],
             ['Deep spiral, 10¹⁴×', '-0.743643887037158704752191506114774', '0.131825904205311970493132056385139', 1e-14],
             ['Deep filaments, 10²⁶×', '-0.7436438870371591749136101569', '0.1318259042053104098662408479', 1e-26]],
    info: { who: 'Benoit Mandelbrot, 1980', dim: '2 (boundary)', rule: 'z ← z² + c, starting at z = 0',
      blurb: 'Every point c on the plane gets a yes-or-no test: start at zero, apply z² + c over and over, and see whether the value stays bounded. The bounded points form the dark body. The colors outside show how quickly the rest escape. The boundary never runs out of detail, and it hides small copies of the whole set.',
      tip: '<b>Try:</b> click any point on the edge of the set and the view glides toward it without stopping. Click again to stop. Hover to preview the Julia set for that point, and click the preview to open it.' } },
  { id: 'julia', group: 'Escape-time', name: 'Julia set', kind: 'escape', type: 1, dim: 'varies',
    view: { cx: 0, cy: 0, w: 3.2 }, iter: 300, c: [-0.123, 0.745],
    cs: [['Douady rabbit', -0.123, 0.745], ['San Marco', -0.75, 0], ['Siegel disk', -0.391, -0.587], ['Dendrite', 0, 1], ['Spiral', 0.285, 0.01], ['Dust', 0.3, 0.5]],
    info: { who: 'Gaston Julia and Pierre Fatou, 1918', dim: 'depends on c (up to 2)', rule: 'z ← z² + c, with c fixed',
      blurb: 'The same formula as the Mandelbrot set with the roles swapped: c is held fixed and the starting point z varies across the plane. When c lies inside the Mandelbrot set the Julia set is one connected piece. When c lies outside, it breaks apart into dust.',
      tip: '<b>Try:</b> drag the c sliders slowly toward the Dust preset and watch the shape pinch apart.' } },
  { id: 'burning-ship', group: 'Escape-time', name: 'Burning Ship', kind: 'escape', type: 2, dim: '—',
    view: { cx: -0.45, cy: -0.5, w: 3.4 }, iter: 300,
    places: [['Whole set', -0.45, -0.5, 3.4], ['The ship', -1.762, -0.028, 0.08], ['Armada', -1.861, -0.002, 0.012]],
    info: { who: 'Michelitsch and Rössler, 1992', dim: 'not known exactly', rule: 'z ← (|Re z| + i·|Im z|)² + c',
      blurb: 'Take the absolute value of the real and imaginary parts before squaring. That one change breaks the smooth symmetry of the Mandelbrot set and produces jagged, flame-like structures. A small ship-shaped copy sits out on the left antenna.',
      tip: '<b>Try:</b> jump to The ship, then raise iterations to 800.' } },
  { id: 'tricorn', group: 'Escape-time', name: 'Tricorn', kind: 'escape', type: 3, dim: '—',
    view: { cx: -0.3, cy: 0, w: 3.6 }, iter: 300,
    info: { who: 'Crowe, Hasson, Rippon and Strain-Clark, 1989', dim: 'not known exactly', rule: 'z ← z̄² + c  (z̄ is the conjugate)',
      blurb: 'Flip the sign of the imaginary part before squaring. The set gains three-fold symmetry, and its boundary shows wavy, broken curves that never appear in the Mandelbrot set. Milnor called it the tricorn after its three corners.',
      tip: '<b>Try:</b> zoom into one of the three corners and compare the small copies with mini-brots.' } },
  { id: 'multibrot', group: 'Escape-time', name: 'Multibrot', kind: 'escape', type: 5, dim: '2',
    view: { cx: 0, cy: 0, w: 3.2 }, iter: 250, pow: 3,
    info: { who: 'Generalizes the Mandelbrot set', dim: '2 (boundary, whole-number d)', rule: 'z ← z^d + c',
      blurb: 'Raise z to a power d instead of 2. The set gains d − 1 fold rotational symmetry. Fractional powers produce a visible seam where the complex angle wraps around, which makes the morph between whole numbers worth watching.',
      tip: '<b>Try:</b> drag the power slider slowly from 2 to 3.' } },
  { id: 'newton', group: 'Escape-time', name: 'Newton fractal', kind: 'escape', type: 4, dim: '> 1',
    view: { cx: 0, cy: 0, w: 3 }, iter: 60,
    info: { who: 'Question posed by Arthur Cayley, 1879', dim: 'boundary > 1', rule: 'z ← z − (z³ − 1) / 3z²',
      blurb: "Newton's method for solving z³ = 1, started from every point on the plane. Each pixel is colored by which of the three cube roots it reaches and shaded by how many steps it took. Every point on a boundary touches all three basins at once.",
      tip: '<b>Try:</b> zoom into any boundary. The three colors keep braiding together at every scale.' } },

  { id: 'fern', group: 'Iterated function systems', name: 'Barnsley fern', kind: 'fern', dim: 'self-affine',
    info: { who: 'Michael Barnsley, 1988', dim: 'self-affine, no closed form', rule: '4 affine maps, chosen with p = 0.01, 0.85, 0.07, 0.07',
      blurb: 'Four affine maps, each picked at random with its own probability, are applied to a single point over and over. The trail of points draws a fern. Changing the numbers slightly gives a different species.',
      tip: '<b>Try:</b> switch the species and compare the leaf shapes.' } },
  { id: 'chaos', group: 'Iterated function systems', name: 'Chaos game', kind: 'chaos', dim: '1.585',
    info: { who: 'Michael Barnsley, 1988', dim: 'log 3 / log 2 ≈ 1.585 (triangle)', rule: 'p ← p + r·(v − p), with v a random vertex',
      blurb: 'Pick a vertex at random and jump part of the way toward it, then repeat. With three vertices and a half-way jump, the points settle onto the Sierpinski triangle. Rules that limit which vertex comes next produce very different patterns.',
      tip: '<b>Try:</b> four vertices with no rule fills a plain square. Add “not the same vertex twice” and a fractal appears.' } },

  { id: 'koch', group: 'L-systems', name: 'Koch snowflake', kind: 'lsys', dim: '1.262',
    axiom: 'F--F--F', rules: { F: 'F+F--F+F' }, angle: 60, iter: 4, maxIter: 7, heading: 0,
    info: { who: 'Helge von Koch, 1904', dim: 'log 4 / log 3 ≈ 1.262', rule: 'F → F+F−−F+F, angle 60°',
      blurb: 'Replace the middle third of every edge with two sides of a small equilateral triangle. The perimeter grows by a third at each step and becomes infinite, while the enclosed area stays finite at 8/5 of the starting triangle.',
      tip: '<b>Try:</b> change the angle to 80° or 85° to get the spikier Cesàro variants.' } },
  { id: 'dragon', group: 'L-systems', name: 'Dragon curve', kind: 'lsys', dim: '2',
    axiom: 'FX', rules: { X: 'X+YF+', Y: '-FX-Y' }, angle: 90, iter: 12, maxIter: 17, heading: 0,
    info: { who: 'Heighway, Banks and Harter, 1966', dim: '2 (boundary ≈ 1.524)', rule: 'X → X+YF+,  Y → −FX−Y, angle 90°',
      blurb: 'Fold a strip of paper in half again and again, then open every fold to a right angle. The resulting curve never crosses itself, and four copies of it tile the plane.',
      tip: '<b>Try:</b> press Animate drawing to watch the fold sequence unwind.' } },
  { id: 'hilbert', group: 'L-systems', name: 'Hilbert curve', kind: 'lsys', dim: '2',
    axiom: 'A', rules: { A: '+Bf-AfA-fB+', B: '-Af+BfB+fA-' }, draw: 'f', angle: 90, iter: 5, maxIter: 8, heading: 0,
    info: { who: 'David Hilbert, 1891', dim: '2', rule: 'A → +BF−AFA−FB+,  B → −AF+BFB+FA−',
      blurb: 'A continuous curve that eventually passes through every point of a square. Each step replaces the curve with four smaller, rotated copies joined end to end. Databases and image formats use it to keep nearby points close together in memory.',
      tip: '<b>Try:</b> step the iterations up one at a time and follow a single corner.' } },
  { id: 'arrowhead', group: 'L-systems', name: 'Sierpinski arrowhead', kind: 'lsys', dim: '1.585',
    axiom: 'A', rules: { A: 'B-A-B', B: 'A+B+A' }, angle: 60, iter: 6, maxIter: 10, heading: 0,
    info: { who: 'Wacław Sierpiński, 1915 (triangle)', dim: 'log 3 / log 2 ≈ 1.585', rule: 'A → B−A−B,  B → A+B+A, angle 60°',
      blurb: 'A single unbroken path that converges on the Sierpinski triangle. Each segment becomes three segments bent at 60°, alternating from side to side.',
      tip: '<b>Try:</b> odd and even iteration counts point the arrowhead in different directions.' } },
  { id: 'gosper', group: 'L-systems', name: 'Gosper curve', kind: 'lsys', dim: '2',
    axiom: 'A', rules: { A: 'A-B--B+A++AA+B-', B: '+A-BB--B-A++A+B' }, angle: 60, iter: 4, maxIter: 6, heading: 0,
    info: { who: 'Bill Gosper, 1973', dim: '2 (boundary ≈ 1.129)', rule: 'A → A−B−−B+A++AA+B−,  B → +A−BB−−B−A++A+B',
      blurb: 'Also called the flowsnake. Seven copies of the curve fit inside a slightly larger, rotated copy. The region it fills, the Gosper island, tiles the plane.',
      tip: '<b>Try:</b> Animate drawing at 5 iterations.' } },
  { id: 'levy', group: 'L-systems', name: 'Lévy C curve', kind: 'lsys', dim: '2',
    axiom: 'F', rules: { F: '+F--F+' }, angle: 45, iter: 12, maxIter: 17, heading: 0,
    info: { who: 'Ernesto Cesàro, 1906; Paul Lévy, 1938', dim: '2', rule: 'F → +F−−F+, angle 45°',
      blurb: 'Replace each segment with the two legs of an isosceles right triangle built on it. After many steps the curve looks like an ornate letter C.',
      tip: '<b>Try:</b> nudge the angle away from 45° to see it twist.' } },
  { id: 'plant', group: 'L-systems', name: 'Fractal plant', kind: 'lsys', dim: '—',
    axiom: 'X', rules: { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' }, angle: 25, iter: 5, maxIter: 7, heading: 75,
    info: { who: 'Aristid Lindenmayer, 1968', dim: '—', rule: 'X → F+[[X]−X]−F[−FX]+X,  F → FF',
      blurb: 'Lindenmayer created L-systems to model how algae and plants grow. Square brackets save and restore the drawing position, which is what creates the branches.',
      tip: '<b>Try:</b> angles between 18° and 30° give the most natural-looking plants.' } },
  { id: 'lab', group: 'L-systems', name: 'L-system lab', kind: 'lsys', lab: true, dim: 'yours',
    axiom: 'F-G-G', rules: { F: 'F-G+F+G-F', G: 'GG' }, angle: 120, iter: 6, maxIter: 12, heading: 0,
    info: { who: 'Your own rules', dim: 'depends on your rules', rule: 'F G A B draw · f moves · + − turn · [ ] branch · | turn around',
      blurb: 'Write your own rewriting rules. Each iteration replaces every symbol with its rule, and then a turtle follows the final string. The starting rules draw a Sierpinski triangle.',
      tip: '<b>Try:</b> load any preset below, then change a single symbol in a rule.' } },

  { id: 'tree', group: 'Recursive geometry', name: 'Fractal tree', kind: 'tree', dim: '—',
    info: { who: 'A classic recursion exercise', dim: 'depends on angle and ratio', rule: 'branch → two branches, each ratio × as long',
      blurb: 'Each branch ends by splitting into two shorter branches at a fixed angle. Three numbers, the split angle, the length ratio and the lean, control the entire shape.',
      tip: '<b>Try:</b> turn on Sway, then set the angle near 90° for a T-square pattern.' } },

}

let miniDirty = true;
function renderMini() {

  drawMini({ cx: 0, cy: 0, scale: 3.2 / m.width, type: 1, iter: 200, c, pow: 2, density: st().cycle / 100 });
  $('#miniLabel').textContent = `c = ${c[0].toFixed(3)} ${c[1] < 0 ? '−' : '+'} ${Math.abs(c[1]).toFixed(3)}i`;
}
$('#mini').addEventListener('click', () => {
  const c = st().miniC; select('julia'); Object.assign(st(), { cRe: +c[0].toFixed(4), cIm: +c[1].toFixed(4), cx: 0, cy: 0, w: 3.2 }); buildControls(); restart();
});

// ---------- point-cloud fractals (fern, chaos game) ----------
const FERNS = {
  classic: { name: 'Black spleenwort (classic)', m: [[0,0,0,.16,0,0,.01],[.85,.04,-.04,.85,0,1.6,.85],[.2,-.26,.23,.22,0,1.6,.07],[-.15,.28,.26,.24,0,.44,.07]] },
  cyclosorus: { name: 'Cyclosorus (mutant)', m: [[0,0,0,.25,0,-.4,.02],[.95,.005,-.005,.93,-.002,.5,.84],[.035,-.2,.16,.04,-.09,.02,.07],[-.04,.2,.16,.04,.083,.12,.07]] },
  culcita: { name: 'Culcita (mutant)', m: [[0,0,0,.25,0,-.14,.02],[.85,.02,-.02,.83,0,1,.84],[.09,-.28,.3,.11,0,.6,.07],[-.09,.28,.3,.09,0,.7,.07]] },
};
const CHAOS_RULES = { none: 'Any vertex', same: 'Not the same vertex twice', ccw: 'Not the next vertex counter-clockwise', adj: 'Not a neighbor of the last vertex' };
const CHAOS_PRESETS = [['Sierpinski triangle', 3, 0.5, 'none'], ['Pentaflake', 5, 0.618, 'none'], ['Hexaflake', 6, 0.667, 'none'],
  ['Square, no repeats', 4, 0.5, 'same'], ['Square, no CCW', 4, 0.5, 'ccw'], ['Pentagon, no repeats', 5, 0.5, 'same']];

function makeSystem(s) {
  if (cur.kind === 'fern') {
    const m = FERNS[s.variant].m; const sys = { x: 0, y: 0, k: 0, byY: true };
    sys.next = () => {
      let r = Math.random(), t = m[m.length - 1];

      if (s.rule === 'ccw' && v === (sys.prev + 1) % n) continue;

}
function startPoints() {
  const s = st(), W = c2.width, H = c2.height, sys = makeSystem(s);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < 30000; i++) { sys.next(); if (i > 50) { x0 = Math.min(x0, sys.x); x1 = Math.max(x1, sys.x); y0 = Math.min(y0, sys.y); y1 = Math.max(y1, sys.y); } }
  const pad = 0.06, sc = Math.min(W * (1 - 2 * pad) / (x1 - x0 || 1), H * (1 - 2 * pad) / (y1 - y0 || 1));
  const ox = (W - (x1 - x0) * sc) / 2, oy = (H + (y1 - y0) * sc) / 2;
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) { const c = palRGB((sys.byY ? 0.08 + i / 255 * 0.34 : i / 255) + G.shift); lut[i * 3] = c[0] * 255; lut[i * 3 + 1] = c[1] * 255; lut[i * 3 + 2] = c[2] * 255; }
  return { sys, W, H, sc, ox, oy, x0, y0, y1, lut, n: 0, max: 1, total: s.points, t0: performance.now(),
    cnt: new Float32Array(W * H), R: new Float32Array(W * H), Gc: new Float32Array(W * H), B: new Float32Array(W * H), img: ctx.createImageData(W, H) };
}
function stepPoints(j) {
  if (j.W !== c2.width || j.H !== c2.height) { job = null; return; }
  if (j.n >= j.total && j.done) return;
  const { sys, W, H, sc, ox, oy, x0, y0, y1, lut, cnt, R, Gc, B } = j;
  const batch = Math.min(80000, j.total - j.n), yr = y1 - y0 || 1;
  for (let i = 0; i < batch; i++) {
    sys.next();
    const px = (ox + (sys.x - x0) * sc) | 0, py = (oy - (sys.y - y0) * sc) | 0;
    if (px < 0 || py < 0 || px >= W || py >= H) continue;
    const idx = py * W + px;
    const ci = (sys.byY ? Math.min(255, Math.max(0, ((sys.y - y0) / yr * 255) | 0)) : ((sys.k / sys.n * 256) | 0)) * 3;
    const c = ++cnt[idx]; R[idx] += lut[ci]; Gc[idx] += lut[ci + 1]; B[idx] += lut[ci + 2];
    if (c > j.max) j.max = c;
  }
  j.n += batch;
  const d = j.img.data, lm = Math.log(1 + j.max * 0.5);
  for (let i = 0, p = 0; i < cnt.length; i++, p += 4) {
    const c = cnt[i];

    const a = Math.min(1, Math.sqrt(Math.log(1 + c) / lm)), ia = 1 - a;
    d[p] = BG[0] * ia + R[i] / c * a; d[p + 1] = BG[1] * ia + Gc[i] / c * a; d[p + 2] = BG[2] * ia + B[i] / c * a; d[p + 3] = 255;

  readout(`${(j.n / 1e6).toFixed(2)} M of ${(j.total / 1e6).toFixed(1)} M points${j.done ? `  ·  ${((performance.now() - j.t0) / 1000).toFixed(1)} s` : ''}`);
}

// ---------- L-systems ----------
function parseRules(text) {
  const r = {};
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*(\S)\s*(?:=|->|→|:)\s*(.*?)\s*$/);
    if (m) r[m[1]] = m[2].replace(/\s+/g, '').replace(/−/g, '-');
  }
  return r;
}
function buildLsys() {
  const s = st(), rules = cur.lab ? parseRules(s.rules) : cur.rules, axiom = (cur.lab ? s.axiom : cur.axiom).replace(/\s+/g, '').replace(/−/g, '-');
  let str = axiom, capped = -1;
  for (let i = 0; i < s.iter; i++) {
    let len = 0; for (let j = 0; j < str.length; j++) { const q = rules[str[j]]; len += q !== undefined ? q.length : 1; }
    if (len > 3e6) { capped = i; break; }
    const parts = new Array(str.length);
    for (let j = 0; j < str.length; j++) { const q = rules[str[j]]; parts[j] = q !== undefined ? q : str[j]; }
    str = parts.join('');
  }
  const a = s.angle * Math.PI / 180, draw = new Set(['F', 'G', 'A', 'B']), moveOnly = new Set(['f']);
  if (cur.draw) for (const ch of cur.draw) draw.add(ch);
  let x = 0, y = 0, hd = (s.heading || 0) * Math.PI / 180;
  const seg = [], stack = []; let x0 = 0, x1 = 0, y0 = 0, y1 = 0;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (draw.has(ch)) {
      const nx = x + Math.cos(hd), ny = y + Math.sin(hd); seg.push(x, y, nx, ny); x = nx; y = ny;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    } else if (moveOnly.has(ch)) { x += Math.cos(hd); y += Math.sin(hd); }
    else if (ch === '+') hd += a; else if (ch === '-') hd -= a; else if (ch === '|') hd += Math.PI;
    else if (ch === '[') stack.push([x, y, hd]); else if (ch === ']' && stack.length) [x, y, hd] = stack.pop();
  }
  const note = $('#note');
  note.hidden = capped < 0; if (capped >= 0) note.textContent = `Stopped at ${capped} iterations: the next step is over 3 million symbols`;
  return { seg: Float64Array.from(seg), x0, x1, y0, y1, len: str.length };
}
function drawLsys(L, progress) {
  const W = c2.width, H = c2.height;
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, W, H);
  const n = L.seg.length / 4; if (!n) { readout('Nothing to draw: no F, G, A or B in the final string'); return; }
  const pad = 0.07, sc = Math.min(W * (1 - 2 * pad) / (L.x1 - L.x0 || 1), H * (1 - 2 * pad) / (L.y1 - L.y0 || 1));
  const ox = (W - (L.x1 - L.x0) * sc) / 2 - L.x0 * sc, oy = (H + (L.y1 - L.y0) * sc) / 2 + L.y0 * sc;
  const m = Math.floor(n * progress), K = 96, seg = L.seg;
  ctx.lineWidth = Math.max(0.7 * dpr(), Math.min(2.4 * dpr(), sc * 0.18)); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let b = 0; b < K; b++) {
    const s0 = Math.floor(b * n / K), s1 = Math.min(m, Math.floor((b + 1) * n / K));
    if (s0 >= s1) break;
    ctx.beginPath(); let px = NaN, py = NaN;
    for (let i = s0; i < s1; i++) {
      const ax = ox + seg[i * 4] * sc, ay = oy - seg[i * 4 + 1] * sc, bx = ox + seg[i * 4 + 2] * sc, by = oy - seg[i * 4 + 3] * sc;
      if (Math.abs(ax - px) > 0.01 || Math.abs(ay - py) > 0.01) ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by); px = bx; py = by;
    }
    ctx.strokeStyle = css(palRGB(0.08 + b / K * 0.8 + G.shift)); ctx.stroke();
  }
  readout(`${n.toLocaleString()} segments · ${L.len.toLocaleString()} symbols`);
}
function animateLsys() {
  if (!job || !job.seg) return;
  anim = { t0: performance.now(), dur: Math.min(4000, 1200 + job.seg.length / 4 * 0.05) };
}

// ---------- recursive geometry ----------
let treeFit = null;
function treeSegs(s, t) {
  const levels = Array.from({ length: s.depth }, () => []), A = s.angle * Math.PI / 180;
  const br = (x, y, len, ang, d) => {
    const nx = x + len * Math.cos(ang), ny = y + len * Math.sin(ang);
    levels[d].push(x, y, nx, ny);
    if (d + 1 >= s.depth) return;
    const sw = t == null ? 0 : Math.sin(t * 1.3 + d * 0.55) * 0.035 * (d + 1) / s.depth * 3;
    br(nx, ny, len * s.ratio, ang + A * (1 + s.skew * 0.6) + sw, d + 1);
    br(nx, ny, len * s.ratio, ang - A * (1 - s.skew * 0.6) + sw, d + 1);
  };
  br(0, 0, 1, Math.PI / 2, 0);
  return levels;
}
const bbox = arrs => { let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const a of arrs) for (let i = 0; i < a.length; i += 2) { const x = a[i], y = a[i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return { x0, x1, y0, y1 }; };
function fit(b, pad = 0.07) {
  const W = c2.width, H = c2.height, sc = Math.min(W * (1 - 2 * pad) / (b.x1 - b.x0 || 1), H * (1 - 2 * pad) / (b.y1 - b.y0 || 1));
  return { sc, ox: (W - (b.x1 - b.x0) * sc) / 2 - b.x0 * sc, oy: (H + (b.y1 - b.y0) * sc) / 2 + b.y0 * sc };
}
function drawTree(t) {
  const s = st(), key = [s.depth, s.angle, s.ratio, s.skew].join();
  if (!treeFit || treeFit.key !== key) { const b = bbox(treeSegs(s, null)); const m = (b.x1 - b.x0) * 0.04; b.x0 -= m; b.x1 += m; treeFit = { key, ...fit(b) }; }
  const levels = treeSegs(s, s.sway ? t : null), { sc, ox, oy } = treeFit;
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, c2.width, c2.height); ctx.lineCap = 'round';
  levels.forEach((a, d) => {
    ctx.beginPath();
    for (let i = 0; i < a.length; i += 4) { ctx.moveTo(ox + a[i] * sc, oy - a[i + 1] * sc); ctx.lineTo(ox + a[i + 2] * sc, oy - a[i + 3] * sc); }
    ctx.lineWidth = Math.max(0.6 * dpr(), sc * 0.07 * Math.pow(s.ratio, d * 1.1));
    ctx.strokeStyle = css(palRGB(0.02 + d / Math.max(1, s.depth - 1) * 0.7 + G.shift)); ctx.stroke();
  });
  readout(`${(Math.pow(2, s.depth) - 1).toLocaleString()} branches`);
}
function drawPythag() {
  const s = st(), a = s.angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), levels = Array.from({ length: s.depth }, () => []);
  const sq = (px, py, vx, vy, d) => {
    const nx = -vy, ny = vx, p1x = px + vx, p1y = py + vy, p2x = p1x + nx, p2y = p1y + ny, p3x = px + nx, p3y = py + ny;
    levels[d].push(px, py, p1x, p1y, p2x, p2y, p3x, p3y);
    if (d + 1 >= s.depth) return;
    const lx = (vx * ca - vy * sa) * ca, ly = (vx * sa + vy * ca) * ca;

    const qx = p3x + lx, qy = p3y + ly; sq(qx, qy, p2x - qx, p2y - qy, d + 1);
  };
  sq(0, 0, 1, 0, 0);
  const { sc, ox, oy } = fit(bbox(levels));
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, c2.width, c2.height);
  levels.forEach((L, d) => {
    ctx.beginPath();
    for (let i = 0; i < L.length; i += 8) {
      ctx.moveTo(ox + L[i] * sc, oy - L[i + 1] * sc);
      for (let k = 2; k < 8; k += 2) ctx.lineTo(ox + L[i + k] * sc, oy - L[i + k + 1] * sc);
      ctx.closePath();
    }
    ctx.fillStyle = css(palRGB(0.02 + d / Math.max(1, s.depth - 1) * 0.75 + G.shift)); ctx.fill();
  });

}
function drawGrid() {
  const s = st(), W = c2.width, H = c2.height, S = Math.floor(Math.min(W, H) * 0.88), x0 = (W - S) >> 1, y0 = (H - S) >> 1, mask = cur.mask, d = s.depth;
  const img = ctx.createImageData(W, H), D = img.data;
  const inLut = [], holeLut = [];
  for (let i = 0; i < 64; i++) inLut.push(palRGB(0.05 + i / 63 * 0.6 + G.shift).map(v => v * 255));
  for (let k = 0; k <= d; k++) holeLut.push(palRGB(0.65 + k / Math.max(1, d) * 0.3 + G.shift).map(v => v * 255 * (0.10 + 0.14 * k / Math.max(1, d))));

  for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
    let u = (px + 0.5) / S, v = (py + 0.5) / S, level = -1;

    const p = ((py + y0) * W + px + x0) * 4; D[p] = c[0]; D[p + 1] = c[1]; D[p + 2] = c[2];

  ctx.putImageData(img, 0, 0);
  const kept = mask.reduce((a, b) => a + b, 0);

}

// ---------- performance & limits ----------
function buildPerf() {
  let gpu = 'Unknown';
  try {
    const g = document.createElement('canvas').getContext('webgl'), ext = g && g.getExtension('WEBGL_debug_renderer_info');
    if (g) gpu = ext ? g.getParameter(ext.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER);
    gpu = String(gpu).replace(/^ANGLE \((.*)\)$/, '$1').replace(/, Unspecified Version$/, '');
  } catch (e) {}
  const [W, H] = [gl2c.width || glc.width, gl2c.height || glc.height];
  const limits = [
    'Your graphics chip does the heavy lifting. Apple Silicon Macs and computers with a dedicated graphics card draw most deep views in under a second. Older laptops, Chromebooks and phones can take several seconds per frame.',
    'Use a current version of Chrome, Edge, Safari or Firefox. Deep zoom needs WebGL2. Without it the Mandelbrot set stops at about 100,000×.',
    'Gliding slows itself down to match how fast your computer finishes each frame. A slower machine glides more slowly instead of stuttering.',
    'Mandelbrot deep zoom ends at about 10³⁰×. Julia, Burning Ship, Tricorn, Multibrot and Newton stop at about 100,000× because they use single precision.',
    'Views full of dark interior are the slowest, because every dark pixel runs every iteration. Aim for the colorful edges.',
    'Battery saver and low-power modes slow the graphics chip down. Plug in for the smoothest glide.',
    'High-resolution screens have more pixels to compute. Rendering is capped at twice the screen size in each direction to keep it manageable; a smaller window is faster.',
    'The fern, chaos game and L-systems run on the main processor. Their largest settings take a few seconds.',
  ];
  $('#perf').replaceChildren(
    h('h4', {}, 'Performance & limits'),
    h('dl', { class: 'facts' },
      h('dt', {}, 'Deep zoom'), deep ? h('dd', { class: 'ok' }, 'Available on this browser') : h('dd', { class: 'bad' }, 'Unavailable: WebGL2 is missing'),
      h('dt', {}, 'Graphics'), h('dd', { class: 'm' }, gpu),
      h('dt', {}, 'Pixels'), h('dd', { class: 'm', id: 'perfPx' }, `${W} × ${H} per frame`)),
    h('ul', { class: 'limits' }, limits.map(t => h('li', {}, t))));
}
$('#perfLink').addEventListener('click', () => $('#perf').scrollIntoView({ behavior: 'smooth', block: 'start' }));

// ---------- boot ----------
buildCatalog();
const start = (location.hash || '').slice(1);
select(byId[start] ? start : 'mandelbrot');

requestAnimationFrame(frame);
