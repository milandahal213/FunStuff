<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw in the air · Through the Looking Glass</title>
<meta name="description" content="Tap real surfaces to place coloured shapes in AR, with a camera-window fallback where WebXR isn't available.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  #count { position: fixed; top: 58px; right: 14px; z-index: 25; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .shapes .btn { padding: 9px 12px; }
  .shapes .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .mode-badge { font-family: var(--mono); font-size: 11px; color: var(--accent); }
</style>
</head>
<body>
<div class="stage">
  <video id="video" playsinline muted hidden></video>
  <canvas id="canvas"></canvas>
</div>

<div class="topbar">
  <a class="home" href="index.html">← Looking Glass</a>
  <span class="title">Draw in the air <span class="mode-badge" id="modeBadge"></span></span>
</div>
<div id="count" hidden>0 shapes</div>

<!-- Intro / capability gate -->
<div class="overlay" id="intro">
  <div class="panel card">
    <h2>Draw in the air</h2>
    <p id="introText">Checking what your device supports…</p>
    <p style="font-size:13px">World-anchored AR: <span class="badge" id="bxr">—</span> &nbsp; Camera window: <span class="badge" id="bcam">—</span></p>
    <div class="row">
      <button class="btn primary" id="startBtn" disabled>Checking…</button>
      <a class="btn ghost" href="index.html">Back</a>
    </div>
  </div>
</div>

<!-- In-experience controls (also the WebXR dom-overlay root) -->
<div id="ui" hidden>
  <div class="hint" id="hint"></div>
  <div class="controls">
    <div class="shapes" style="display:flex;gap:8px">
      <button class="btn" data-shape="box" aria-pressed="true">◻︎</button>
      <button class="btn" data-shape="sphere" aria-pressed="false">●</button>
      <button class="btn" data-shape="cone" aria-pressed="false">▲</button>
      <button class="btn" data-shape="cylinder" aria-pressed="false">⬢</button>
      <button class="btn" data-shape="torus" aria-pressed="false">◯</button>
    </div>
    <div class="swatches" id="swatches"></div>
    <button class="btn" id="undo">↶ Undo</button>
    <button class="btn ghost" id="clear">Clear</button>
    <button class="btn ghost" id="exit" hidden>Exit</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const COLORS = ['#36d6c3', '#ff6b6b', '#ffb454', '#5b8cff', '#c084fc', '#f5f7fa'];
let shape = 'box', color = COLORS[0];

const canvas = document.getElementById('canvas');
const video = document.getElementById('video');
const ui = document.getElementById('ui');
const hint = document.getElementById('hint');
const countEl = document.getElementById('count');
const modeBadge = document.getElementById('modeBadge');

let renderer, scene, camera, reticle, hitTestSource = null, placed = [];
let mode = null; // 'xr' | 'window'

// ---------- shared scene ----------
function buildScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
  const dir = new THREE.DirectionalLight(0xffffff, 1.4); dir.position.set(1, 3, 2); scene.add(dir);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  const ring = new THREE.RingGeometry(0.07, 0.09, 36).rotateX(-Math.PI / 2);
  reticle = new THREE.Mesh(ring, new THREE.MeshBasicMaterial({ color: 0x36d6c3 }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
}

function makeMesh() {
  let g;
  if (shape === 'box') g = new THREE.BoxGeometry(0.12, 0.12, 0.12);
  else if (shape === 'sphere') g = new THREE.SphereGeometry(0.075, 32, 24);
  else if (shape === 'cone') g = new THREE.ConeGeometry(0.08, 0.16, 32);
  else if (shape === 'cylinder') g = new THREE.CylinderGeometry(0.07, 0.07, 0.15, 32);
  else g = new THREE.TorusGeometry(0.08, 0.03, 20, 36);
  const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.4, metalness: 0.1 });
  return new THREE.Mesh(g, m);
}

function addPlaced(mesh) {
  scene.add(mesh); placed.push(mesh);
  countEl.hidden = false; countEl.textContent = placed.length + (placed.length === 1 ? ' shape' : ' shapes');
}

// ---------- capability detection ----------
async function detect() {
  let xrOk = false;
  try { xrOk = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch {}
  const camOk = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && isSecureContext;
  document.getElementById('bxr').className = 'badge ' + (xrOk ? 'ok' : 'no');
  document.getElementById('bxr').textContent = xrOk ? 'yes' : 'no';
  document.getElementById('bcam').className = 'badge ' + (camOk ? 'ok' : 'no');
  document.getElementById('bcam').textContent = camOk ? 'yes' : 'no';
  const btn = document.getElementById('startBtn');
  const txt = document.getElementById('introText');
  if (xrOk) {
    mode = 'xr';
    txt.innerHTML = 'Your device supports world-anchored AR. Point at the floor, move until a ring appears, then tap to stick shapes to real surfaces.';
    btn.textContent = 'Start AR'; btn.disabled = false;
  } else if (camOk) {
    mode = 'window';
    txt.innerHTML = 'No world-anchored AR here (expected on iPhone and laptops), so this opens a <b>camera window</b>: your shapes float in a 3D space you look around by moving the phone or dragging.';
    btn.textContent = 'Start camera window'; btn.disabled = false;
  } else {
    txt.innerHTML = 'This device has neither WebXR AR nor camera access over HTTPS. Try an Android phone (Chrome) for full AR, or any phone/laptop with a camera.';
    btn.textContent = 'Not available'; btn.disabled = true;
  }
}

// ---------- start ----------
document.getElementById('startBtn').addEventListener('click', async () => {
  // iOS needs an explicit gesture-triggered permission for motion; ask for it for the window mode.
  if (mode === 'window' && typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch {}
  }
  buildScene();
  document.getElementById('intro').hidden = true;
  ui.hidden = false;
  if (mode === 'xr') startXR(); else startWindow();
});

// ---------- WebXR AR ----------
async function startXR() {
  modeBadge.textContent = 'WebXR';
  hint.textContent = 'Move your phone to find a surface, then tap to place.';
  document.getElementById('exit').hidden = false;
  renderer.xr.enabled = true;
  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay', 'local-floor'],
    domOverlay: { root: document.getElementById('ui') }
  });
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);

  const viewerSpace = await session.requestReferenceSpace('viewer');
  hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

  session.addEventListener('select', () => {
    if (!reticle.visible) return;
    const m = makeMesh();
    m.position.setFromMatrixPosition(reticle.matrix);
    // seat non-centered shapes so they rest on the surface
    if (shape === 'box') m.position.y += 0.06;
    else if (shape === 'sphere') m.position.y += 0.075;
    else if (shape === 'cone' || shape === 'cylinder') m.position.y += 0.08;
    addPlaced(m);
  });
  session.addEventListener('end', () => { location.reload(); });
  document.getElementById('exit').onclick = () => session.end();

  renderer.setAnimationLoop((t, frame) => {
    if (frame && hitTestSource) {
      const refSpace = renderer.xr.getReferenceSpace();
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length) {
        const pose = results[0].getPose(refSpace);
        reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix);
      } else reticle.visible = false;
    }
    renderer.render(scene, camera);
  });
}

// ---------- Camera-window fallback ----------
async function startWindow() {
  modeBadge.textContent = 'camera window';
  reticle.visible = false;
  hint.innerHTML = 'Tap anywhere to drop a shape ~1&nbsp;m ahead · turn your phone (or drag) to look around';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) {
    hint.textContent = 'Camera permission denied — shapes still work on a black background.';
  }
  if (stream) { video.srcObject = stream; video.hidden = false; await video.play().catch(()=>{}); }

  // Orientation control: device orientation if available, else pointer drag.
  const q = new THREE.Quaternion();
  let useDeviceOrient = false;
  const zee = new THREE.Vector3(0, 0, 1);
  const euler = new THREE.Euler();
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -PI/2 around x
  function onOrient(e) {
    if (e.alpha == null) return;
    useDeviceOrient = true;
    const alpha = THREE.MathUtils.degToRad(e.alpha);
    const beta = THREE.MathUtils.degToRad(e.beta);
    const gamma = THREE.MathUtils.degToRad(e.gamma);
    const orient = THREE.MathUtils.degToRad(screen.orientation ? screen.orientation.angle : (window.orientation || 0));
    euler.set(beta, alpha, -gamma, 'YXZ');
    q.setFromEuler(euler);
    q.multiply(q1);
    q.multiply(q0.setFromAxisAngle(zee, -orient));
    camera.quaternion.copy(q);
  }
  window.addEventListener('deviceorientation', onOrient, true);

  // pointer-drag look (for laptops / when orientation is absent)
  let dragging = false, px = 0, py = 0, yaw = 0, pitch = 0;
  canvas.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointermove', e => {
    if (!dragging || useDeviceOrient) return;
    yaw -= (e.clientX - px) * 0.005; pitch -= (e.clientY - py) * 0.005;
    pitch = Math.max(-1.4, Math.min(1.4, pitch)); px = e.clientX; py = e.clientY;
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  });

  // tap to place (distinguish from drag)
  let downX = 0, downY = 0;
  canvas.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
  canvas.addEventListener('pointerup', e => {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) return; // was a drag
    const m = makeMesh();
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    m.position.copy(camera.position).addScaledVector(fwd, 1.1);
    addPlaced(m);
  });

  renderer.setClearColor(0x000000, 0); // transparent over the video
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
}

// ---------- UI wiring ----------
document.querySelectorAll('.shapes .btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.shapes .btn').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true'); shape = b.dataset.shape;
}));
const sw = document.getElementById('swatches');
COLORS.forEach((c, i) => {
  const s = document.createElement('button');
  s.className = 'swatch'; s.style.background = c; s.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
  s.addEventListener('click', () => {
    sw.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', 'false'));
    s.setAttribute('aria-pressed', 'true'); color = c;
  });
  sw.appendChild(s);
});
document.getElementById('undo').addEventListener('click', () => {
  const m = placed.pop(); if (!m) return;
  scene.remove(m); m.geometry.dispose(); m.material.dispose();
  countEl.textContent = placed.length + (placed.length === 1 ? ' shape' : ' shapes');
  if (!placed.length) countEl.hidden = true;
});
document.getElementById('clear').addEventListener('click', () => {
  placed.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
  placed = []; countEl.hidden = true;
});

addEventListener('resize', () => {
  if (!renderer || mode === 'xr') return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

detect();
</script>
</body>
</html>
