<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beyond the Rubber Sheet</title>
<meta name="description" content="Seven interactive 3D views of curved spacetime computed from general relativity: why things fall, black hole lensing, warped space and slowed clocks, orbits, light cones, tidal stretching and gravitational waves.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: scene list | live 3D stage | notes and controls; stacks on phones.
   Deliberately single dark theme: this is a view into space. */
:root {
  --ink: #090b12;
  --stage: #030409;
  --panel: #10131d;
  --line: #232839;
  --fg: #e7e9f0;
  --muted: #8a90a8;
  --accent: #ffb366;
  --cool: #8cc2ff;
  --accent-soft: rgba(255, 179, 102, 0.13);
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 340px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header h1 { font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; margin: 0; }
header h1 em { color: var(--accent); }
header p { margin: 0; color: var(--muted); }
.back { color: var(--muted); text-decoration: none; font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; align-self: center; }
.back:hover { color: var(--accent); border-color: var(--accent); }

.catalog { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; flex-direction: column; gap: 1px; background: none; border: 0; border-radius: 8px; padding: 9px 12px; text-align: left; cursor: pointer; }
.item:hover { background: var(--panel); }
.item b { font-weight: 500; }
.item span { font-size: 12.5px; color: var(--muted); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item[aria-current="true"] b { color: var(--accent); }

.stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--stage); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.overlay { position: absolute; font-family: var(--mono); font-size: 11.5px; background: rgba(3, 4, 9, 0.74); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; pointer-events: none; font-variant-numeric: tabular-nums; }
#readout { left: 10px; bottom: 10px; max-width: calc(100% - 20px); white-space: pre-wrap; }
#hint { right: 10px; top: 10px; color: var(--muted); max-width: calc(100% - 20px); }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.panel { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
.badge { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; border: 1px solid currentColor; }
.badge.exact { color: var(--cool); }
.badge.approx { color: var(--accent); }
.card h2 { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
.card h4 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; }
.leaves { color: var(--muted); font-size: 13px; }
.tip { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.tip b { color: var(--fg); font-weight: 600; }

.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.ctl output { font-family: var(--mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1d1206; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: #1d1206; }
.seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { flex: 1 1 auto; background: var(--ink); border: 0; border-right: 1px solid var(--line); padding: 5px 8px; cursor: pointer; font-size: 12.5px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.legend { height: 10px; border-radius: 3px; }
.legend-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.small { font-size: 12px; color: var(--muted); }

@media (max-width: 1150px) { .app { grid-template-columns: 210px minmax(0, 1fr) 300px; } }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .catalog { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .item { border: 1px solid var(--line); white-space: nowrap; }
  .item span { display: none; }
  .stage { height: 64vh; min-height: 340px; }
  #hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="../">← FunStuff</a>
    <h1>Beyond the <em>Rubber Sheet</em></h1>
    <p>Seven 3D views of curved spacetime, each computed from general relativity.</p>
  </header>
  <nav class="catalog" id="catalog" aria-label="Scenes"></nav>
  <main class="stage" id="stage">
    <canvas id="c" aria-label="3D scene"></canvas>
    <div class="overlay" id="hint"></div>
    <div class="overlay" id="readout"></div>
    <div class="fail" id="fail" hidden></div>
  </main>
  <aside class="panel">
    <section class="card" id="info"></section>
    <section class="card" id="controls"></section>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Units throughout: G = c = 1 and the Schwarzschild radius r_s = 1, so M = 1/2.
const M = 0.5;

// ---------- dom helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function slider({ id, label, min, max, step, value, fmt = v => v, oninput }) {
  const out = h('output', {}, fmt(value));
  const inp = h('input', { type: 'range', id, min, max, step });
  inp.value = value;
  inp.addEventListener('input', () => { const v = parseFloat(inp.value); out.textContent = fmt(v); oninput(v); });
  return h('div', { class: 'ctl' }, h('label', { for: id }, h('span', {}, label), out), inp);
}
function check({ id, label, checked, onchange }) {
  return h('label', { class: 'check' }, h('input', { type: 'checkbox', id, checked, onchange: e => onchange(e.target.checked) }), label);
}
function seg({ label, options, value, onchange }) {
  const wrap = h('div', { class: 'seg', role: 'group', 'aria-label': label });
  const set = v => { for (const b of wrap.children) b.setAttribute('aria-pressed', b.dataset.v === String(v) ? 'true' : 'false'); };
  for (const [v, text] of options) wrap.append(h('button', { 'data-v': v, onclick: () => { set(v); onchange(v); } }, text));
  set(value);
  return h('div', { class: 'ctl' }, h('label', {}, h('span', {}, label)), wrap);
}
const buttons = list => h('div', { class: 'row' }, list.map(([text, fn, primary]) => h('button', { class: primary ? 'btn primary' : 'btn', onclick: fn }, text)));

// ---------- renderer & shared 3D helpers ----------
const canvas = $('#c'), stage = $('#stage');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x030409);
  renderer.localClippingEnabled = true;
} catch (e) {
  const f = $('#fail'); f.hidden = false; f.textContent = 'This page needs WebGL, which this browser could not start. Try a current Chrome, Edge, Safari or Firefox.';
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let readoutText = '';
const readout = t => { if (t !== readoutText) { readoutText = t; $('#readout').textContent = t; } };

function glowMaterial(color, power = 2.6, strength = 1.2) {
  return new THREE.ShaderMaterial({
    uniforms: { c: { value: new THREE.Color(color) }, p: { value: power }, s: { value: strength } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
    fragmentShader: 'uniform vec3 c; uniform float p, s; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), p); gl_FragColor = vec4(c*f*s, f); }',
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  });
}
function blackHole(r = 1, glow = 0xff9a4d) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32), new THREE.MeshBasicMaterial({ color: 0x000000 })));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(r * 1.035, 48, 32), glowMaterial(glow));
  g.add(halo);
  return g;
}
function circle(r, color, { opacity = 0.6, dashed = false, y = 0 } = {}) {
  const pts = [];
  for (let i = 0; i <= 160; i++) { const a = i / 160 * Math.PI * 2; pts.push(new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a))); }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = dashed ? new THREE.LineDashedMaterial({ color, dashSize: 0.22, gapSize: 0.16, transparent: true, opacity })
    : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const line = new THREE.Line(geo, mat);
  if (dashed) line.computeLineDistances();
  return line;
}
function polarGrid(radius, rings, sectors, opacity = 0.18) {
  const g = new THREE.PolarGridHelper(radius, sectors, rings, 96, 0x8a90a8, 0x8a90a8);
  g.material.transparent = true; g.material.opacity = opacity; g.material.depthWrite = false;
  return g;
}
function label(text, { size = 0.45, color = '#c9cdda' } = {}) {
  const c = document.createElement('canvas'), ctx = c.getContext('2d'), fs = 48;
  const font = `500 ${fs}px "IBM Plex Sans", system-ui, sans-serif`;
  ctx.font = font;
  c.width = Math.ceil(ctx.measureText(text).width) + 24; c.height = fs + 22;
  ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, 12, c.height / 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(size * c.width / c.height, size, 1);
  return s;
}
function disposeTree(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of mats) { if (m.map) m.map.dispose(); m.dispose(); }
  });
}
function makeControls(camera, target = [0, 0, 0]) {
  const c = new OrbitControls(camera, canvas);
  c.enableDamping = true; c.dampingFactor = 0.08; c.target.set(...target);
  return c;
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ======================================================================
// 1. Black hole lensing: ray-traced null geodesics on the GPU
// ======================================================================
const LENS_FS = `
precision highp float;
varying vec2 vUv;
uniform vec3 uCamPos; uniform mat3 uCamRot;
uniform float uTanFov, uAspect, uGravity, uDisk, uDoppler, uIn, uOut, uTime;
uniform int uBg;

float hash31(vec3 p){ p = fract(p*0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y)*p.z); }
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash21(i), hash21(i + vec2(1,0)), u.x), mix(hash21(i + vec2(0,1)), hash21(i + vec2(1,1)), u.x), u.y); }

vec3 starLayer(vec3 d, float scale, float keep){
  vec3 q = d*scale, id = floor(q), f = fract(q) - 0.5;
  if (hash31(id) < 1.0 - keep) return vec3(0.0);
  vec3 o = vec3(hash31(id + 1.7), hash31(id + 4.3), hash31(id + 9.1)) - 0.5;
  float b = smoothstep(0.13, 0.0, length(f - o*0.7)) * (0.35 + 0.65*hash31(id + 2.9));
  return mix(vec3(1.0, 0.78, 0.6), vec3(0.72, 0.84, 1.0), hash31(id + 5.5)) * b * 1.7;
}
vec3 stars(vec3 d){
  vec3 c = starLayer(d, 28.0, 0.035)*1.4 + starLayer(d, 70.0, 0.07) + starLayer(d, 160.0, 0.05)*0.6;
  float band = exp(-pow((d.y*0.85 + d.x*0.3)*3.0, 2.0));
  float n = noise(vec2(atan(d.z, d.x)*5.0, d.y*12.0))*0.6 + noise(vec2(atan(d.z, d.x)*13.0, d.y*31.0))*0.4;
  return c + vec3(0.34, 0.29, 0.45)*band*(0.15 + 0.55*n)*0.4;
}
vec3 gridSky(vec3 d){
  float a = acos(clamp(d.y, -1.0, 1.0))/3.14159265*18.0, b = (atan(d.z, d.x)/3.14159265 + 1.0)*18.0;
  float line = max(smoothstep(0.43, 0.49, abs(fract(a) - 0.5)), smoothstep(0.43, 0.49, abs(fract(b) - 0.5)));
  vec3 base = mix(vec3(0.04, 0.05, 0.09), vec3(0.08, 0.09, 0.15), mod(floor(a) + floor(b), 2.0));
  vec3 tint = d.y > 0.0 ? vec3(0.35, 0.6, 1.0) : vec3(1.0, 0.55, 0.25);
  return base + tint*line*0.85;
}
vec3 heat(float t){
  t = clamp(t, 0.0, 2.6);
  vec3 c = mix(vec3(0.45, 0.04, 0.0), vec3(1.0, 0.42, 0.07), smoothstep(0.0, 0.6, t));
  c = mix(c, vec3(1.0, 0.86, 0.62), smoothstep(0.55, 1.15, t));
  return mix(c, vec3(0.72, 0.84, 1.0), smoothstep(1.15, 2.1, t));
}
vec4 disk(vec3 p, vec3 dir){
  float r = length(p.xz);
  float om = 0.70710678/pow(r, 1.5);                  // Keplerian angular speed, sqrt(M/r^3)
  float a = -om*uTime, ca = cos(a), sa = sin(a);
  vec2 q = vec2(ca*p.x - sa*p.z, sa*p.x + ca*p.z);     // texture rotated with the gas
  float tex = noise(q*1.6)*0.55 + noise(q*4.5)*0.3 + noise(q*11.0)*0.15;
  float rings = 0.7 + 0.3*noise(vec2(r*7.0, 1.3));
  float T = pow(uIn/r, 0.75)*1.15;
  float edge = smoothstep(uIn, uIn*1.12, r)*(1.0 - smoothstep(uOut*0.7, uOut, r));
  float v = min(sqrt(0.5/max(r - 1.0, 0.02)), 0.98);  // orbital speed seen by a static observer
  float gam = 1.0/sqrt(1.0 - v*v);
  vec3 vhat = vec3(-p.z, 0.0, p.x)/r;
  vec3 n = -normalize(dir);                            // photon direction at emission, toward the camera
  float g = sqrt(1.0 - 1.0/r)/(gam*(1.0 - v*dot(vhat, n)));
  g = mix(1.0, g, uDoppler);
  vec3 col = heat(T*g)*pow(g, 3.0)*(0.45 + 0.9*tex)*rings*1.5;
  return vec4(col, edge*clamp(0.3 + 0.8*tex, 0.0, 1.0));
}
void main(){
  vec2 ndc = vUv*2.0 - 1.0;
  vec3 dir = normalize(uCamRot*vec3(ndc.x*uTanFov*uAspect, ndc.y*uTanFov, -1.0));
  vec3 pos = uCamPos;
  vec3 L = cross(pos, dir);
  float h2 = dot(L, L);
  vec3 col = vec3(0.0); float trans = 1.0; bool hole = false;
  for (int i = 0; i < 520; i++) {
    float r = length(pos);
    if (r < 1.0) { hole = true; break; }
    float dt = clamp(0.045*r*(r - 0.85), 0.008, 1.6);
    // Exact photon orbits: Binet's equation u'' + u = 3Mu^2 written as a 3D force law
    vec3 acc = -1.5*h2*pos/pow(r, 5.0)*uGravity;
    vec3 vh = dir + 0.5*dt*acc;
    vec3 np = pos + vh*dt;
    float nr = length(np);
    dir = vh + 0.5*dt*(-1.5*h2*np/pow(nr, 5.0)*uGravity);
    if (uDisk > 0.5 && pos.y*np.y <= 0.0 && pos.y != np.y) {
      vec3 hit = mix(pos, np, pos.y/(pos.y - np.y));
      float rh = length(hit.xz);
      if (rh > uIn && rh < uOut) {
        vec4 dc = disk(hit, dir);
        col += trans*dc.rgb*dc.a; trans *= 1.0 - dc.a;
        if (trans < 0.02) break;
      }
    }
    pos = np;
    if (nr > 90.0 && dot(pos, dir) > 0.0) break;
  }
  if (!hole && trans > 0.02) {
    vec3 d = normalize(dir);
    col += trans*(uBg == 0 ? stars(d) : uBg == 1 ? gridSky(d) : vec3(0.0));
  }
  col = col/(1.0 + col*0.55);
  gl_FragColor = vec4(pow(col, vec3(0.92)), 1.0);
}`;

function makeLensing() {
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
  camera.position.set(0, 1.5, 17);
  const controls = makeControls(camera);
  controls.minDistance = 2.4; controls.maxDistance = 70; controls.enablePan = false; controls.autoRotateSpeed = 0.35;
  const o = { gravity: true, disk: true, doppler: true, bg: 0, inner: 3, outer: 12, quality: 1, spin: true };
  const U = {
    uCamPos: { value: new THREE.Vector3() }, uCamRot: { value: new THREE.Matrix3() }, uTanFov: { value: 0 }, uAspect: { value: 1 },
    uGravity: { value: 1 }, uDisk: { value: 1 }, uDoppler: { value: 1 }, uBg: { value: 0 }, uIn: { value: 3 }, uOut: { value: 12 }, uTime: { value: 0 },
  };
  const scene = new THREE.Scene();
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: U, depthTest: false, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: LENS_FS,
  })));
  const flat = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  let time = 0;
  return {
    scene, camera, controls, renderCamera: flat,
    get pixelRatio() { return [DPR, 1, 0.6][o.quality]; },
    update(dt) {
      if (o.spin) time += dt * 6;
      camera.updateMatrixWorld();
      U.uCamPos.value.copy(camera.position);
      U.uCamRot.value.setFromMatrix4(camera.matrixWorld);
      U.uTanFov.value = Math.tan(camera.fov * Math.PI / 360);
      U.uAspect.value = camera.aspect;
      U.uGravity.value = o.gravity ? 1 : 0; U.uDisk.value = o.disk ? 1 : 0; U.uDoppler.value = o.doppler ? 1 : 0;
      U.uBg.value = o.bg; U.uIn.value = o.inner; U.uOut.value = o.outer; U.uTime.value = time;
      readout(`camera ${camera.position.length().toFixed(1)} r_s from the center   ·   ${fps.toFixed(0)} fps`);
    },
    ui: () => [
      seg({ label: 'Background', options: [[0, 'Stars'], [1, 'Grid sky'], [2, 'None']], value: o.bg, onchange: v => { o.bg = +v; } }),
      check({ id: 'grav', label: 'Gravity bends light', checked: o.gravity, onchange: v => { o.gravity = v; } }),
      check({ id: 'disk', label: 'Glowing disk of gas', checked: o.disk, onchange: v => { o.disk = v; } }),
      check({ id: 'dopp', label: 'Doppler and gravitational color shifts', checked: o.doppler, onchange: v => { o.doppler = v; } }),

  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);

  const tang = (r, s) => [[r, 0, 0], [0, 0, -s]];

    ['Precessing orbit', () => launch(false, ...tang(10, 0.78 * vc(10)))],
    ['Circle at 5 r_s', () => launch(false, ...tang(5, vc(5)))],
    ['Last stable orbit', () => launch(false, ...tang(3, vc(3) * 0.999))],
    ['Zoom-whirl', () => launch(false, ...tang(12, 0.7145 * vc(12)))],
    ['Plunge', () => launch(false, ...tang(12, 0.45 * vc(12)))],
    ['Light ring', () => launch(true, [1.5 * 1.0002, 0, 0], [0, 0, -1])],
    ['Beam of light', () => { for (let b = 1.2; b <= 6.2; b += 0.5) launch(true, [-40, 0, b], [1, 0, 0]); }],
    ['Spray of matter', () => { for (let k = 0; k < 9; k++) launch(false, ...tang(8, (0.55 + k * 0.12) * vc(8))); }],

    },
    ui: () => [
      seg({ label: 'Launch', options: [['matter', 'Matter'], ['light', 'Light']], value: o.kind, onchange: v => { o.kind = v; } }),
      check({ id: 'aim', label: 'Left-drag on the plane to launch', checked: o.aim, onchange: v => { o.aim = v; setAim(); } }),
      check({ id: 'ghost', label: 'Also show what Newton predicts (gray)', checked: o.ghost, onchange: v => { o.ghost = v; } }),
      slider({ id: 'speed', label: 'Simulation speed', min: 2, max: 80, step: 1, value: o.speed, fmt: v => `${v}`, oninput: v => { o.speed = v; } }),

      buttons([['Clear', () => { clearAll(); stats = { in: 0, out: 0 }; }, true]]),

}

// ======================================================================
// 4. Light cones in Eddington–Finkelstein (or Schwarzschild) coordinates

    tube.position.y = Tmax / 2; world.add(tube);
    for (let y = 0; y <= Tmax; y += 1) { const c = circle(1, 0xffb366, { opacity: 0.35, y }); c.material.clippingPlanes = [clip]; world.add(c); }
    const sing = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, Tmax, 0)]), clipMat(new THREE.LineDashedMaterial({ color: 0xff5a3c, dashSize: 0.2, gapSize: 0.12 })));

      const p = obs[Math.max(0, i)]; marker.position.set(p[0], Math.min(p[1], T), 0); marker.visible = obs.length > 0 && obs[0][1] <= T;
      const r = p[0];
      const where = o.coords !== 'ef' && i === obs.length - 1 ? 'never shown crossing the horizon in these coordinates'
        : r > 1 ? `outside the horizon, ${r.toFixed(2)} r_s` : r > 0.03 ? `inside the horizon, ${r.toFixed(2)} r_s` : 'reached the singularity';
      readout(`time ${Math.min(T, Tmax).toFixed(1)}   ·   falling observer: ${where}`);
    },
    ui: () => [
      seg({ label: 'Coordinates', options: [['ef', 'Smooth (Eddington–Finkelstein)'], ['schw', 'Schwarzschild']], value: o.coords, onchange: v => { o.coords = v; build(); } }),
      check({ id: 'anim', label: 'Let time run upward', checked: o.animate, onchange: v => { o.animate = v; } }),
      slider({ id: 'tspeed', label: 'Time speed', min: 0.2, max: 3, step: 0.1, value: o.speed, fmt: v => `${(+v).toFixed(1)}×`, oninput: v => { o.speed = v; } }),
      h('p', { class: 'small' }, 'Up is time; the flat plane is space with one dimension left out. Each cone holds every direction a flash of light can go from that point. Blue lines are flashes the falling observer sends outward, orange ones are flashes sent from inside the horizon.'),
      h('p', { class: 'small' }, 'In Schwarzschild coordinates the cones pinch shut at the horizon and the observer seems to freeze there. That is a flaw of the coordinates, not of spacetime: switch back and the same fall is smooth.'),
    ],
    hint: 'Drag to orbit · scroll to zoom',

// ======================================================================
// 5. Tidal stretching: a cloud of free particles falling in
// ======================================================================
function makeTides() {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.005, 500);
  const controls = makeControls(camera); controls.minDistance = 0.05; controls.maxDistance = 80;
  scene.add(blackHole(1));
  scene.add(polarGrid(14, 7, 16, 0.1));
  const o = { size: 0.5, r0: 7, speed: 1, follow: true };
  const N = 2200;
  const pos = new Float64Array(N * 3), vel = new Float64Array(N * 3), h2 = new Float64Array(N), stopped = new Uint8Array(N);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 2.4, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.95 }));
  pts.frustumCulled = false; scene.add(pts);
  let tau = 0, done = false, center = new THREE.Vector3(), s0 = 1;
  function drop() {
    const R = o.size, col = geo.attributes.color.array, cool = [0.55, 0.76, 1], warm = [1, 0.7, 0.4];
    for (let i = 0; i < N; i++) {
      let x, y, z; do { x = Math.random() * 2 - 1; y = Math.random() * 2 - 1; z = Math.random() * 2 - 1; } while (x * x + y * y + z * z > 1);
      pos[i * 3] = o.r0 + x * R; pos[i * 3 + 1] = y * R; pos[i * 3 + 2] = z * R;
      vel[i * 3] = vel[i * 3 + 1] = vel[i * 3 + 2] = 0; h2[i] = 0; stopped[i] = 0;
      const k = (x + 1) / 2; for (let c = 0; c < 3; c++) col[i * 3 + c] = lerp(warm[c], cool[c], k);
    }
    geo.attributes.color.needsUpdate = true;
    s0 = R / Math.sqrt(5); tau = 0; done = false;
    center.set(o.r0, 0, 0);
    camera.position.set(o.r0 + R * 1.2, R * 2.2, R * 6.5); controls.target.copy(center);
    sync();
  }
  function sync() { const a = geo.attributes.position.array; for (let i = 0; i < N * 3; i++) a[i] = pos[i]; geo.attributes.position.needsUpdate = true; }
  // Same exact equation as the orbit playground; radial infall from rest has almost no angular momentum
  function step(dt) {
    for (let i = 0; i < N; i++) {
      if (stopped[i]) continue;
      const j = i * 3;
      const f = (x, y, z) => { const r2 = x * x + y * y + z * z, r = Math.sqrt(r2); return -(M / (r2 * r) + 3 * M * h2[i] / (r2 * r2 * r)); };

      const k1 = f(x, y, z);
      const xm = x + u * dt / 2, ym = y + v * dt / 2, zm = z + w * dt / 2;
      const um = u + k1 * x * dt / 2, vm = v + k1 * y * dt / 2, wm = w + k1 * z * dt / 2;
      const k2 = f(xm, ym, zm);
      pos[j] = x + um * dt; pos[j + 1] = y + vm * dt; pos[j + 2] = z + wm * dt;
      vel[j] = u + k2 * xm * dt; vel[j + 1] = v + k2 * ym * dt; vel[j + 2] = w + k2 * zm * dt;

  const prevCenter = new THREE.Vector3();
  let info = '';
  return {
    scene, camera, controls,
    update(dt) {
      if (!done) {
        let span = dt * o.speed * Math.min(1.2, Math.sqrt(center.length()) * 0.6);
        while (span > 0) { const r = Math.max(center.length(), 0.04), d = Math.min(span, 0.004 * r ** 1.5); step(d); span -= d; tau += d; center.set(0, 0, 0); for (let i = 0; i < N; i++) center.x += pos[i * 3] / N, center.y += pos[i * 3 + 1] / N, center.z += pos[i * 3 + 2] / N; if (center.length() < 0.06) { done = true; break; } }
        sync();
      }
      if (o.follow) { const d = center.clone().sub(prevCenter.lengthSq() ? prevCenter : center); camera.position.add(d); controls.target.add(d); }
      prevCenter.copy(center);
      // Measure stretch along the fall and squeeze across it
      const u = center.clone().normalize(); let along = 0, across = 0;
      for (let i = 0; i < N; i += 4) {
        const dx = pos[i * 3] - center.x, dy = pos[i * 3 + 1] - center.y, dz = pos[i * 3 + 2] - center.z;

      }
      along = Math.sqrt(along / (N / 4)) / s0; across = Math.sqrt(across / (N / 4)) / s0;
      const r = center.length(), r0 = o.r0;
      const eta = Math.acos(clamp(2 * r / r0 - 1, -1, 1)), left = Math.sqrt(r0 ** 3 / (8 * M)) * (Math.PI - eta - Math.sin(eta));
      info = done ? 'the cloud has reached the singularity: inside the horizon every path ends there'
        : `${r.toFixed(2)} r_s from the center${r < 1 ? ' (inside the horizon)' : ''}   ·   stretched ${along.toFixed(2)}× along the fall, ${across.toFixed(2)}× across\nproper time left: ${left.toFixed(2)} r_s/c`;
      readout(info);
    },
    ui: () => {
      const sizes = [['Star near a small black hole', 0.5], ['Ship near a giant black hole', 0.02]];
      return [
        h('h4', {}, 'Cloud size compared with the black hole'),
        buttons(sizes.map(([n, s]) => [n, () => { o.size = s; drop(); sl.querySelector('input').value = Math.log10(s); sl.querySelector('output').textContent = `${s} r_s`; }])),
        (sl = slider({ id: 'csize', label: 'Cloud radius', min: -2, max: -0.1, step: 0.01, value: Math.log10(o.size), fmt: v => `${(10 ** v).toPrecision(2)} r_s`, oninput: v => { o.size = 10 ** v; drop(); } })),
        slider({ id: 'r0', label: 'Start distance', min: 3, max: 14, step: 0.1, value: o.r0, fmt: v => `${(+v).toFixed(1)} r_s`, oninput: v => { o.r0 = v; drop(); } }),
        slider({ id: 'tspeed2', label: 'Speed', min: 0.1, max: 3, step: 0.05, value: o.speed, fmt: v => `${(+v).toFixed(2)}×`, oninput: v => { o.speed = v; } }),
        check({ id: 'follow', label: 'Camera rides along with the cloud', checked: o.follow, onchange: v => { o.follow = v; } }),
        buttons([['Drop again', drop, true]]),
        h('p', { class: 'small' }, 'Colors mark where each particle started: orange on the side nearer the black hole, blue on the far side.'),
      ];
    },
    hint: 'Drag to orbit · scroll to zoom',
  };
  var sl;
}

// ======================================================================
// 6. Gravitational waves from an inspiraling binary (quadrupole approximation)
// ======================================================================
function makeWaves() {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 800);
  camera.position.set(26, 20, 30);
  const controls = makeControls(camera, [0, 2, 0]); controls.minDistance = 5; controls.maxDistance = 140;
  const o = { mode: 'chirp', height: 1, rings: true, sheet: true, speed: 1 };
  const V = 4, OM0 = 1.05, OMMAX = 6, TC = 16, A0 = 3;

  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3)); sg.setAttribute('color', new THREE.BufferAttribute(sc, 3)); sg.setIndex(idx);
  const sheet = new THREE.Group();
  sheet.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })));
  sheet.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: 0x8a90a8, wireframe: true, transparent: true, opacity: 0.08 })));
  scene.add(sheet);
  // Binary
  const bh1 = blackHole(0.45), bh2 = blackHole(0.45), merged = blackHole(0.75); merged.visible = false;
  scene.add(bh1, bh2, merged);
  // Source history for retarded-time lookups
  let hist = { t: [], A: [], P: [] };
  let t = 0, phase = 0, om = OM0, stage = 'inspiral', tm = 0, amp = 0;
  function sample(tr) {
    const H = hist; if (!H.t.length || tr < H.t[0]) return null;
    let lo = 0, hi = H.t.length - 1; if (tr >= H.t[hi]) return [H.A[hi], H.P[hi]];

    world.add(b1, b2, now);
    const lab = (t, p, c) => { const l = label(t, { size: 0.42, color: c }); l.position.set(...p); world.add(l); };
    lab('time ↑', [-7.5, TMAX * K * 0.5, 0], '#8a90a8');
    lab('dashed: the paths with no gravity', [0, -0.6, 6.5], '#8a90a8');
    let T = 0;
    return {
      ui: () => [
        slider({ id: 'ratio', label: 'Mass of the orange ball', min: 0.1, max: 1, step: 0.05, value: o.ratio, fmt: v => `${(+v).toFixed(2)} × blue`, oninput: v => { o.ratio = v; build(); } }),
        slider({ id: 'push', label: 'Sideways push', min: 0, max: 1.3, step: 0.01, value: o.push, fmt: v => +v === 0 ? 'none: dropped from rest' : +v === 1 ? 'circular orbit' : `${(+v).toFixed(2)}× circular`, oninput: v => { o.push = v; build(); } }),
        buttons([['Drop from rest', () => { o.push = 0; build(); refreshControls(); }], ['Orbit', () => { o.push = 1; build(); refreshControls(); }]]),
        slider({ id: 'fspeed', label: 'Animation speed', min: 0.2, max: 2, step: 0.05, value: o.speed, fmt: v => `${(+v).toFixed(2)}×`, oninput: v => { o.speed = v; } }),
        h('p', { class: 'small' }, 'Up is time and the flat plane is space. Two balls released at rest start with parallel worldlines, both pointing straight into the future. Nothing pushes them, yet the lines drift together: that drift is spacetime curvature. With a sideways push the worldlines become helices.'),
        h('p', { class: 'small' }, 'In real proportions these curves are almost perfectly straight. Earth’s orbit around the Sun, drawn the same way, is a helix about 16 light-minutes wide but one light-year tall per turn: roughly 30,000 times taller than wide.'),
      ],
      update(dt) {
        T += dt * o.speed * 4; if (T > TMAX + 6) T = 0;
        const y = Math.min(T, TMAX) * K; clip.constant = y; now.position.y = y;
        const i = Math.min(w1.length - 1, Math.floor(Math.min(T, TMAX) / 0.05));
        b1.position.copy(w1[i]); b2.position.copy(w2[i]);
        const sep = w1[i].distanceTo(w2[i]);
        readout(merged >= 0 && T >= merged ? `time ${Math.min(T, TMAX).toFixed(1)} · the two masses have collided` : `time ${Math.min(T, TMAX).toFixed(1)} · separation ${sep.toFixed(2)}`);
      },
    };
  }

  build(true);
  return {
    scene, camera, controls,
    update(dt) { api.update(dt); },
    get hint() { return o.mode === 'aging' ? 'Drag the orange handle to change the path · drag elsewhere to orbit · scroll to zoom' : 'Drag to orbit · scroll to zoom'; },
    ui: () => [
      seg({ label: 'Show', options: [['aging', 'A thrown ball'], ['pair', 'Two masses']], value: o.mode, onchange: v => { o.mode = v; build(true); refreshControls(); } }),
      ...api.ui(),
    ],
    dispose() { api?.dispose?.(); },
  };
}

// ======================================================================
// Scene catalog and app shell
// ======================================================================
const SCENES = [
  { id: 'lensing', name: 'Black hole lensing', sub: 'How a black hole bends the light behind it', exact: true, make: makeLensing,
    seeing: 'Every pixel traces one ray of light backward from the camera along its true curved path around a non-spinning black hole. The far side of the glowing disk shows up bent over the top and under the bottom. The thin bright ring hugging the shadow is light that circled the hole before reaching you. The side of the disk moving toward you looks brighter and bluer; the side moving away looks dimmer and redder.',
    leaves: 'Real black holes spin, which squashes one side of the shadow. The disk is an idealized thin sheet with made-up texture, and its colors are stylized rather than a true spectrum.',
    tip: 'Switch the background to Grid sky, then turn gravity off and on to see exactly how the sky gets rearranged.' },
  { id: 'fall', name: 'Why things fall', sub: 'The path where your clock ticks the most', exact: false, make: makeFall,
    seeing: 'A spacetime diagram of a ball thrown up and caught 2 seconds later, with time running to the right. Tick marks show clocks running faster higher up. Drag the orange handle to try other paths between the same launch and catch: each path collects ticks on its own clock, and the real throw (blue) always collects the most. Going higher gains time from faster clocks; moving faster to get there loses time. The real arc is the exact balance. In Two masses, worldlines that start side by side, both pointing straight into the future, drift together with nothing pushing them.',
    leaves: 'Clock differences are exaggerated about 10¹⁵ times. This uses general relativity’s weak-gravity approximation, which is exactly where Newton’s laws come from, and the two-masses view uses Newton’s equations for the motion.',
    tip: 'Drag the handle above the blue path: the faster clocks up high can’t make up for the extra speed you need to get there.' },
  { id: 'grid', name: 'Warped grid and clocks', sub: 'Measured distance and slowed time', exact: true, make: makeGrid,
    seeing: 'A cube of grid lines spaced by true, measured distance. Near a compact mass there is more room between two nested spheres than their sizes suggest, so equal measured steps crowd together in this picture. The clocks tick at the rate general relativity predicts, and the line colors show the same slowdown.',
    leaves: 'Curved 3D space can’t be drawn exactly in flat 3D, so this shows one honest property, distance measured straight outward, and ignores the rest. For everyday gravity, the slowing of time does most of the work of making things fall; the clocks and colors show it, the shape does not.',
    tip: 'Start at Earth, where nothing visibly moves and a surface clock loses about 0.7 nanoseconds each second, then slide up to a neutron star.' },
  { id: 'orbits', name: 'Orbit playground', sub: 'Launch matter and light', exact: true, make: makeOrbits,
    seeing: 'Each path is an exact solution of Einstein’s equations for one non-spinning black hole. Matter orbits don’t close: each pass swings the ellipse around, the same effect measured for Mercury but enormous here. Light bends, can circle the hole at 1.5 r_s, and is captured if aimed too close. The gray paths show what Newton’s gravity would predict from the same start.',
    leaves: 'The moving objects have no mass of their own, so they don’t pull on the black hole or radiate gravitational waves. Paths are drawn in Schwarzschild coordinates, and the clock behind the motion is each object’s own.',
    tip: 'Try Zoom-whirl: the orbit loops around the hole several times near its closest approach before swinging back out.' },
  { id: 'cones', name: 'Light cones', sub: 'Why nothing gets out', exact: true, make: makeCones,
    seeing: 'Time runs upward. Each cone shows every direction light can go from that point, so anything with mass must stay inside it. Far away the cones stand upright. Closer in they tip toward the black hole, at the horizon one edge stands straight up, and inside every cone points inward. A falling observer crosses the horizon smoothly; after that, even light they send outward heads for the singularity.',
    leaves: 'One space dimension is left out, so space looks like a flat plane. The vertical axis is a particular choice of time coordinate, picked because it stays smooth across the horizon.',
    tip: 'Switch to Schwarzschild coordinates to see where the “frozen at the horizon” picture comes from.' },
  { id: 'tides', name: 'Tidal stretching', sub: 'What curvature does to a falling cloud', exact: true, make: makeTides,
    seeing: 'A loose cloud of particles falls straight in from rest, each on its own exact path. The near side falls faster than the far side, so the cloud stretches along the fall, and the sides all head for the same center, so it narrows. Nearby free-falling paths pulling apart like this is what physicists mean by curvature.',
    leaves: 'The particles don’t hold onto each other; a real body resists until its strength gives out. With the camera riding along, the fall of the cloud as a whole is hidden on purpose.',
    tip: 'Compare the two sizes. Near a giant black hole the tides at the horizon are gentle enough that a ship would cross without noticing.' },
  { id: 'waves', name: 'Gravitational waves', sub: 'Ripples from merging black holes', exact: false, make: makeWaves,
    seeing: 'Two black holes orbit, spiral in and merge, and space ripples outward at light speed at twice their orbital frequency. The rings of free-floating particles show what a passing wave does: it stretches space one way while squeezing it the other. Above the orbit the pattern rotates; in the orbital plane it only stretches and squeezes in one direction.',
    leaves: 'Everything is exaggerated about 10²⁰ times; LIGO’s first detection measured a stretch of about one part in 10²¹. The spiral uses the standard quadrupole approximation, and the merger and ringdown are a sketch rather than a full simulation.',
    tip: 'Watch the ring above the orbit during the final second: the ripples speed up and grow, the chirp LIGO listens for.' },
];
const byId = Object.fromEntries(SCENES.map(s => [s.id, s]));
let cur = null, active = null, fps = 60;

function buildCatalog() {
  $('#catalog').replaceChildren(...SCENES.map(s => h('button', { class: 'item', 'data-id': s.id, onclick: () => select(s.id) }, h('b', {}, s.name), h('span', {}, s.sub))));
}
function refreshControls() { $('#controls').replaceChildren(h('h4', {}, 'Controls'), ...active.ui()); $('#hint').textContent = active.hint || ''; }
function select(id) {
  if (!renderer) return;
  if (active) { active.dispose?.(); active.controls?.dispose(); disposeTree(active.scene); }
  cur = byId[id] || SCENES[0];
  active = cur.make();
  for (const b of document.querySelectorAll('.item')) b.setAttribute('aria-current', b.dataset.id === cur.id ? 'true' : 'false');
  try { history.replaceState(null, '', '#' + cur.id); } catch (e) {}
  $('#info').replaceChildren(
    h('span', { class: 'badge ' + (cur.exact ? 'exact' : 'approx') }, cur.exact ? 'Exact general relativity' : 'Standard approximation'),
    h('h2', {}, cur.name),
    h('h4', {}, 'What you’re seeing'), h('p', {}, cur.seeing),
    h('h4', {}, 'What it leaves out'), h('p', { class: 'leaves' }, cur.leaves),
    h('p', { class: 'tip', html: '<b>Try:</b> ' + cur.tip }));
  $('#controls').replaceChildren(h('h4', {}, 'Controls'), ...active.ui());
  $('#hint').textContent = active.hint || '';
  readoutText = ''; resize();
}
function resize() {
  if (!active) return;
  const r = stage.getBoundingClientRect();
  renderer.setPixelRatio(active.pixelRatio ?? DPR);
  renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false);
  active.camera.aspect = r.width / Math.max(1, r.height); active.camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt > 0) fps = lerp(fps, 1 / dt, 0.05);
  if (!active) return;
  active.controls?.update();
  active.update(dt);
  renderer.render(active.scene, active.renderCamera || active.camera);
}
buildCatalog();
const boot = () => { const id = location.hash.slice(1); select(byId[id] ? id : 'lensing'); requestAnimationFrame(tick); };
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(boot);
// Debug hook: step and draw without waiting for animation frames
window.__st = { get active() { return active; }, select, step(n = 1, dt = 1 / 60) {
  for (let i = 0; i < n; i++) { active.controls?.update(); active.update(dt); }
  renderer.render(active.scene, active.renderCamera || active.camera);
} };
</script>
