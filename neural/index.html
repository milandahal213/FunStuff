<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside a Neural Network</title>
<meta name="description" content="Seven interactive chapters that build a neural network from a single neuron up to a trainable playground and convolution, all running live in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: numbered chapter list | live figures | explanation and controls; stacks on phones.
   Single dark theme to match the other FunStuff sites. Blue = positive, orange = negative throughout. */
:root {
  --ink: #0b0c10;
  --panel: #14161d;
  --line: #262935;
  --fg: #e9e8f0;
  --muted: #8f93a6;
  --accent: #c4a7ff;
  --accent-soft: rgba(196, 167, 255, 0.13);
  --pos: #4fa8ff;
  --neg: #ff9147;
  --display: "Fraunces", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 340px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header h1 { font-family: var(--display); font-weight: 650; font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
header h1 em { color: var(--accent); font-style: normal; }
header p { margin: 0; color: var(--muted); }
.back { color: var(--muted); text-decoration: none; font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; align-self: center; }
.back:hover { color: var(--accent); border-color: var(--accent); }

.catalog { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; counter-reset: ch; }
.item { display: grid; grid-template-columns: 26px 1fr; column-gap: 8px; background: none; border: 0; border-radius: 8px; padding: 9px 10px; text-align: left; cursor: pointer; }
.item:hover { background: var(--panel); }
.item .n { grid-row: span 2; font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.item b { font-weight: 500; }
.item span:last-child { font-size: 12.5px; color: var(--muted); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item[aria-current="true"] b, .item[aria-current="true"] .n { color: var(--accent); }

.stage { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.status { font-family: var(--mono); font-size: 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-variant-numeric: tabular-nums; white-space: pre-wrap; min-height: 34px; }
.panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; align-items: start; }
.pane { margin: 0; background: #0f1015; border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pane.wide { grid-column: 1 / -1; }
.pane figcaption { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pane canvas { width: 100%; display: block; border-radius: 6px; touch-action: none; }

.panel { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
.card h2 { font-family: var(--display); font-weight: 650; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.card h4 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.tip { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.tip b { color: var(--fg); font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.ctl output { font-family: var(--mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1030; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: #1a1030; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { flex: 1 1 auto; background: var(--ink); border: 0; border-right: 1px solid var(--line); padding: 5px 8px; cursor: pointer; font-size: 12.5px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.small { font-size: 12px; color: var(--muted); }
.kernel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kernel input { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px; text-align: center; font-family: var(--mono); font-size: 14px; }

@media (max-width: 1150px) { .app { grid-template-columns: 210px minmax(0, 1fr) 300px; } }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .catalog { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .item { border: 1px solid var(--line); white-space: nowrap; }
  .item span:last-child { display: none; }
  .stage { overflow: visible; }
  .panes { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="../">← FunStuff</a>
    <h1>Inside a <em>Neural Network</em></h1>
    <p>Seven chapters, from one neuron to a network you can train. Everything runs live in your browser.</p>
  </header>
  <nav class="catalog" id="catalog" aria-label="Chapters"></nav>
  <main class="stage" id="stage">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="panes" id="panes"></div>
  </main>
  <aside class="panel">
    <section class="card" id="info"></section>
    <section class="card" id="controls"></section>
  </aside>
</div>

<script>
// ---------- dom helpers ----------
const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
function slider({ id, label, min, max, step, value, fmt = v => v, oninput }) {
  const out = h('output', {}, fmt(value));
  const inp = h('input', { type: 'range', id, min, max, step });
  inp.value = value;
  inp.addEventListener('input', () => { const v = parseFloat(inp.value); out.textContent = fmt(v); oninput(v); });
  const wrap = h('div', { class: 'ctl' }, h('label', { for: id }, h('span', {}, label), out), inp);
  wrap.set = v => { inp.value = v; out.textContent = fmt(v); };
  return wrap;
}
function check({ id, label, checked, onchange }) {
  return h('label', { class: 'check' }, h('input', { type: 'checkbox', id, checked, onchange: e => onchange(e.target.checked) }), label);
}
function seg({ label, options, value, onchange }) {
  const wrap = h('div', { class: 'seg', role: 'group', 'aria-label': label });
  const set = v => { for (const b of wrap.children) b.setAttribute('aria-pressed', b.dataset.v === String(v) ? 'true' : 'false'); };
  for (const [v, text] of options) wrap.append(h('button', { 'data-v': v, onclick: () => { set(v); onchange(v); } }, text));
  set(value);
  const c = h('div', { class: 'ctl' }, label ? h('label', {}, h('span', {}, label)) : null, wrap);
  c.set = set;
  return c;
}
const buttons = list => h('div', { class: 'row' }, list.map(([text, fn, primary, id]) => h('button', { class: primary ? 'btn primary' : 'btn', onclick: fn, id }, text)));
const status = t => { const s = $('#status'); if (s.textContent !== t) s.textContent = t; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ---------- colors ----------
const C = { bg: '#0f1015', fg: '#e9e8f0', muted: '#8f93a6', line: '#262935', accent: '#c4a7ff', pos: '#4fa8ff', neg: '#ff9147' };
const BG = [15, 16, 21], POS = [79, 168, 255], NEG = [255, 145, 71];
function valColor(v, k = 1) {
  v = clamp(v, -1, 1); const c = v >= 0 ? POS : NEG, t = Math.abs(v) * k;
  return [BG[0] + (c[0] - BG[0]) * t, BG[1] + (c[1] - BG[1]) * t, BG[2] + (c[2] - BG[2]) * t];
}
const rgb = c => `rgb(${c.map(Math.round).join(',')})`;
const wColor = w => w >= 0 ? C.pos : C.neg;

// ---------- seeded randomness ----------
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());

// ---------- activation functions ----------
const ACT = {
  none: { f: z => z, d: () => 1, label: 'none' },
  linear: { f: z => z, d: () => 1, label: 'linear' },
  step: { f: z => z > 0 ? 1 : 0, d: () => 0, label: 'step' },
  sigmoid: { f: z => 1 / (1 + Math.exp(-z)), d: (z, a) => a * (1 - a), label: 'sigmoid' },
  tanh: { f: Math.tanh, d: (z, a) => 1 - a * a, label: 'tanh' },
  relu: { f: z => z > 0 ? z : 0, d: z => z > 0 ? 1 : 0, label: 'ReLU' },
};

// ---------- a tiny multilayer network with backpropagation and Adam ----------
class MLP {
  constructor(sizes, act = 'tanh', out = 'sigmoid', seed = 1) {
    this.sizes = sizes; this.act = act; this.out = out; this.steps = 0;
    const r = rng(seed);
    this.W = []; this.B = []; this.m = []; this.v = [];
    for (let l = 1; l < sizes.length; l++) {
      const ni = sizes[l - 1], no = sizes[l], hidden = l < sizes.length - 1;
      const sc = act === 'relu' && hidden ? Math.sqrt(2 / ni) : Math.sqrt(1 / ni);
      const W = new Float64Array(no * ni); for (let i = 0; i < W.length; i++) W[i] = gauss(r) * sc;
      this.W.push(W); this.B.push(new Float64Array(no).fill(act === 'relu' && hidden ? 0.05 : 0));
      this.m.push([new Float64Array(no * ni), new Float64Array(no)]); this.v.push([new Float64Array(no * ni), new Float64Array(no)]);
    }
  }
  fn(l) { return l === this.sizes.length - 1 ? this.out : this.act; }
  forward(x) {
    const A = [Float64Array.from(x)], Z = [null];
    for (let l = 1; l < this.sizes.length; l++) {
      const ni = this.sizes[l - 1], no = this.sizes[l], W = this.W[l - 1], B = this.B[l - 1], prev = A[l - 1], f = ACT[this.fn(l)].f;
      const z = new Float64Array(no), a = new Float64Array(no);
      for (let o = 0; o < no; o++) { let s = B[o]; for (let i = 0; i < ni; i++) s += W[o * ni + i] * prev[i]; z[o] = s; a[o] = f(s); }
      Z.push(z); A.push(a);
    }
    return { A, Z };
  }
  predict(x) { const { A } = this.forward(x); return A[A.length - 1][0]; }
  // One full-batch step. X: inputs, Y: targets. Returns mean loss.
  train(X, Y, lr) {
    const L = this.sizes.length - 1, gW = this.W.map(w => new Float64Array(w.length)), gB = this.B.map(b => new Float64Array(b.length));
    let loss = 0;
    for (let n = 0; n < X.length; n++) {
      const { A, Z } = this.forward(X[n]), y = Y[n], out = A[L];
      let delta = new Float64Array(out.length);
      for (let o = 0; o < out.length; o++) {
        const a = out[o], t = Array.isArray(y) ? y[o] : y;
        delta[o] = a - t;   // sigmoid + cross-entropy and linear + squared error share this gradient
        loss += this.out === 'sigmoid' ? -(t * Math.log(a + 1e-9) + (1 - t) * Math.log(1 - a + 1e-9)) : 0.5 * (a - t) ** 2;
      }
      for (let l = L; l >= 1; l--) {
        const ni = this.sizes[l - 1], no = this.sizes[l], W = this.W[l - 1], prev = A[l - 1], gw = gW[l - 1], gb = gB[l - 1];
        for (let o = 0; o < no; o++) { gb[o] += delta[o]; for (let i = 0; i < ni; i++) gw[o * ni + i] += delta[o] * prev[i]; }
        if (l > 1) {
          const d = ACT[this.act].d, nd = new Float64Array(ni);
          for (let i = 0; i < ni; i++) { let s = 0; for (let o = 0; o < no; o++) s += W[o * ni + i] * delta[o]; nd[i] = s * d(Z[l - 1][i], A[l - 1][i]); }
          delta = nd;
        }
      }
    }
    this.steps++;
    const b1 = 0.9, b2 = 0.999, t = this.steps, c1 = 1 - b1 ** t, c2 = 1 - b2 ** t, N = X.length;
    const upd = (P, G, M, V) => { for (let i = 0; i < P.length; i++) { const g = G[i] / N; M[i] = b1 * M[i] + (1 - b1) * g; V[i] = b2 * V[i] + (1 - b2) * g * g; P[i] -= lr * (M[i] / c1) / (Math.sqrt(V[i] / c2) + 1e-8); } };
    for (let l = 0; l < L; l++) { upd(this.W[l], gW[l], this.m[l][0], this.v[l][0]); upd(this.B[l], gB[l], this.m[l][1], this.v[l][1]); }
    return loss / X.length;
  }
}

// ---------- datasets in the square [-1, 1]² ----------
const DATASETS = [['blobs', 'Two blobs'], ['xor', 'XOR'], ['circle', 'Circle'], ['spiral', 'Spiral']];
function makeData(kind, n, noise, seed) {
  const r = rng(seed), pts = [];
  for (let i = 0; i < n; i++) {
    let x, y, c;
    if (kind === 'blobs') { c = i % 2; const m = c ? 0.42 : -0.42; x = m + gauss(r) * (0.17 + noise * 0.6); y = m + gauss(r) * (0.17 + noise * 0.6); }
    else if (kind === 'xor') { x = r() * 1.8 - 0.9; y = r() * 1.8 - 0.9; if (Math.abs(x) < 0.08) x += Math.sign(x || 1) * 0.08; if (Math.abs(y) < 0.08) y += Math.sign(y || 1) * 0.08; c = x * y > 0 ? 1 : 0; x += gauss(r) * noise * 0.4; y += gauss(r) * noise * 0.4; }
    else if (kind === 'circle') { c = i % 2; const rad = c ? r() * 0.45 : 0.62 + r() * 0.3, t = r() * Math.PI * 2; x = rad * Math.cos(t) + gauss(r) * noise * 0.4; y = rad * Math.sin(t) + gauss(r) * noise * 0.4; }
    else { c = i % 2; const k = (i >> 1) / (n / 2), rad = 0.08 + k * 0.85, t = k * 1.75 * Math.PI * 2 + c * Math.PI; x = rad * Math.cos(t) + gauss(r) * noise * 0.3; y = rad * Math.sin(t) + gauss(r) * noise * 0.3; }
    pts.push({ x: clamp(x, -0.98, 0.98), y: clamp(y, -0.98, 0.98), c });
  }

}

// ---------- figure panes ----------
const panes = [];
function pane(title, aspect = 1, { wide = false } = {}) {
  const c = h('canvas', { style: `aspect-ratio:${aspect}` });
  const el = h('figure', { class: 'pane' + (wide ? ' wide' : '') }, h('figcaption', {}, title), c);
  $('#panes').append(el);
  const p = { el, c, ctx: c.getContext('2d'), w: 1, h: 1 };
  p.fit = () => {
    const r = c.getBoundingClientRect(), W = Math.max(1, Math.round(r.width * DPR)), H = Math.max(1, Math.round(r.height * DPR));
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    p.w = r.width || 1; p.h = r.height || 1; p.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  p.local = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  p.clear = () => { p.ctx.fillStyle = C.bg; p.ctx.fillRect(0, 0, p.w, p.h); };
  panes.push(p); p.fit();
  return p;
}
// Pointer dragging on a pane: fn(x, y, event, phase)
function drag(p, fn) {
  let on = false;
  p.c.addEventListener('pointerdown', e => { on = true; p.c.setPointerCapture(e.pointerId); fn(...p.local(e), e, 'down'); });
  p.c.addEventListener('pointermove', e => { if (on) fn(...p.local(e), e, 'move'); else fn(...p.local(e), e, 'hover'); });
  const end = e => { if (on) { on = false; fn(...p.local(e), e, 'up'); } };
  p.c.addEventListener('pointerup', end); p.c.addEventListener('pointercancel', end);
  p.c.addEventListener('pointerleave', e => { if (!on) fn(...p.local(e), e, 'leave'); });
}

// Square plot area inside a pane for the [-1,1]² plane
function planeBox(p, pad = 8) { const s = Math.min(p.w, p.h) - pad * 2; return { x0: (p.w - s) / 2, y0: (p.h - s) / 2, s }; }
const toPx = (b, x, y) => [b.x0 + (x + 1) / 2 * b.s, b.y0 + (1 - y) / 2 * b.s];
const fromPx = (b, px, py) => [(px - b.x0) / b.s * 2 - 1, 1 - (py - b.y0) / b.s * 2];
// Heatmap of f(x, y) in [-1, 1] over the plane, rendered small and smoothed up
const heatCanvas = document.createElement('canvas');
function heatmap(p, f, res = 64, k = 0.8) {
  heatCanvas.width = res; heatCanvas.height = res;
  const hc = heatCanvas.getContext('2d'), img = hc.createImageData(res, res);
  for (let j = 0; j < res; j++) for (let i = 0; i < res; i++) {
    const x = (i + 0.5) / res * 2 - 1, y = 1 - (j + 0.5) / res * 2, c = valColor(f(x, y), k), q = (j * res + i) * 4;
    img.data[q] = c[0]; img.data[q + 1] = c[1]; img.data[q + 2] = c[2]; img.data[q + 3] = 255;
  }
  hc.putImageData(img, 0, 0);
  const b = planeBox(p); p.ctx.imageSmoothingEnabled = true; p.ctx.drawImage(heatCanvas, b.x0, b.y0, b.s, b.s);
  p.ctx.strokeStyle = C.line; p.ctx.lineWidth = 1; p.ctx.strokeRect(b.x0, b.y0, b.s, b.s);
  return b;
}
function dots(p, b, pts, { hollow = false, r = 4.2 } = {}) {
  const ctx = p.ctx;
  for (const d of pts) {
    const [x, y] = toPx(b, d.x, d.y);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = d.c ? C.pos : C.neg; ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = hollow ? 1.6 : 1;
    if (hollow) { ctx.globalAlpha = 0.9; ctx.stroke(); ctx.globalAlpha = 1; } else { ctx.fill(); ctx.globalAlpha = 0.85; ctx.stroke(); ctx.globalAlpha = 1; }
  }
}
// Line chart of one or more series
function lineChart(p, series, { ymin = 0, ymax = null, label = 'loss', log = false } = {}) {
  const ctx = p.ctx; p.clear();
  const L = 34, R = 10, T = 10, B = 22, W = p.w - L - R, H = p.h - T - B;
  // On a log scale, small late improvements stay visible next to the large starting error
  if (log) series = series.map(s => ({ ...s, data: s.data.map(v => Math.log10(Math.max(v, 1e-4))) }));
  const all = series.flatMap(s => s.data);
  if (log) { ymin = Math.floor(Math.min(...all, 0)); ymax = Math.max(ymin + 1, Math.ceil(Math.max(...all))); }
  const top = ymax ?? Math.max(0.05, ...all) * 1.08;
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, T + H); ctx.lineTo(L + W, T + H); ctx.stroke();

// Network diagram with a small picture inside every neuron showing what it responds to over the plane

}

// ======================================================================
// Chapter 3. Learning: rolling downhill on the error surface
// ======================================================================
function chapterLearn() {

    const n = data.length; w1 -= o.lr * g1 / n; w2 -= o.lr * g2 / n; b -= o.lr * gb / n;

  }

  const WR = 9;   // landscape shows w in [-WR, WR]
  function drawPlane() {
    const p = plane, ctx = p.ctx; p.clear();

    dots(p, bx, data);
  }
  const landCanvas = document.createElement('canvas');
  function buildLand() {
    const R = 70; landCanvas.width = R; landCanvas.height = R; const lc = landCanvas.getContext('2d'), img = lc.createImageData(R, R);
    const vals = new Float64Array(R * R); let lo = Infinity, hi = -Infinity;

// ======================================================================

// ======================================================================
// Chapter 7. Convolution: how image networks look for edges
// ======================================================================
function chapterConv() {

    'Horizontal edges': [-1, -2, -1, 0, 0, 0, 1, 2, 1],
    'Outline': [-1, -1, -1, -1, 8, -1, -1, -1, -1],

  const input = pane('Your drawing (drag to paint, Shift to erase)', 1), fmap = pane('Filter applied everywhere (feature map)', 1), relup = pane('After ReLU: keep only the positive parts', 1), poolp = pane('After 2×2 max pooling: smaller, keeps the strongest', 1);
  function grid(p, arr, n, { signed = false, reveal = Infinity, box = null, hl = null } = {}) {
    const ctx = p.ctx; p.clear();
    const b = planeBox(p, 6), cs = b.s / n, m = signed ? Math.max(1e-6, ...Array.from(arr, Math.abs)) : Math.max(1e-6, ...arr);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const q = y * n + x; if (q > reveal) { ctx.fillStyle = '#16171e'; } else if (signed) ctx.fillStyle = rgb(valColor(arr[q] / m, 0.95)); else { const g = arr[q] / m; ctx.fillStyle = rgb([lerp(15, 240, g), lerp(16, 236, g), lerp(21, 250, g)]); }
      ctx.fillRect(b.x0 + x * cs, b.y0 + y * cs, cs - (n < 30 ? 0.6 : 0), cs - (n < 30 ? 0.6 : 0));
    }
    if (box) { ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5; ctx.strokeRect(b.x0 + box[0] * cs, b.y0 + box[1] * cs, box[2] * cs, box[2] * cs); }
    if (hl) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(b.x0 + hl[0] * cs, b.y0 + hl[1] * cs, cs, cs); }

    const cur = anim.on ? [anim.k % M, Math.floor(anim.k / M)] : hover;
    grid(input, img, N, { box: cur ? [cur[0], cur[1], 3] : null });
    grid(fmap, f, M, { signed: true, reveal: anim.on ? anim.k : Infinity, hl: cur });
    grid(relup, r, M, { reveal: anim.on ? anim.k : Infinity, hl: cur });
    grid(poolp, pl, P, { reveal: anim.on ? Math.floor(Math.floor(anim.k / M) / 2) * P + Math.floor((anim.k % M) / 2) : Infinity, hl: cur ? [Math.floor(cur[0] / 2), Math.floor(cur[1] / 2)] : null });
    if (cur) {
      const [x, y] = cur, terms = [];
      for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) if (Math.abs(K[j * 3 + i]) > 1e-9 && img[(y + j) * N + x + i] > 0.01) terms.push(`${(+K[j * 3 + i].toFixed(2))}×${img[(y + j) * N + x + i].toFixed(1)}`);
      const v = Math.abs(f[y * M + x]) < 0.005 ? 0 : f[y * M + x];
      status(`filter at column ${x + 1}, row ${y + 1}: ${terms.length ? terms.join(' + ') : 'nothing under the filter'} = ${v.toFixed(2)}${v < 0 ? ' → ReLU makes it 0' : ''}`);
    } else status('hover over the feature map to see the 9 multiplications behind any square, or press Animate to watch the filter slide');
  };
  let erasing = false;
  drag(input, (px, py, e, ph) => {
    if (ph === 'hover' || ph === 'leave' || ph === 'up') return;
    const b = planeBox(input, 6), x = (px - b.x0) / b.s * N, y = (py - b.y0) / b.s * N;
    if (ph === 'down') erasing = e.shiftKey || e.button === 2;
    paint(x, y, 1.2, erasing ? -1 : 1); redraw();
  });
  input.c.addEventListener('contextmenu', e => e.preventDefault());
  for (const p of [fmap, relup]) drag(p, (px, py, e, ph) => {
    if (ph === 'leave') { hover = null; redraw(); return; }
    const b = planeBox(p, 6), x = Math.floor((px - b.x0) / b.s * M), y = Math.floor((py - b.y0) / b.s * M);
    hover = x >= 0 && y >= 0 && x < M && y < M ? [x, y] : null; redraw();
  });
  let inputs = [], animBtn;
  const setK = k => { K = k.slice(); inputs.forEach((inp, i) => { inp.value = +K[i].toFixed(3); }); redraw(); };
  return {
    redraw,
    tick(dt) { if (!anim.on) return; anim.k += Math.max(1, Math.round(dt * 160)); if (anim.k >= M * M + 40) { anim.on = false; if (animBtn) animBtn.textContent = 'Animate the sliding filter'; } redraw(); },
    ui: () => {
      inputs = K.map((v, i) => h('input', { type: 'number', step: 0.5, value: +v.toFixed(3), 'aria-label': `Filter weight row ${Math.floor(i / 3) + 1} column ${i % 3 + 1}`, oninput: e => { K[i] = parseFloat(e.target.value) || 0; redraw(); } }));
      const ab = buttons([['Animate the sliding filter', () => { anim = { on: true, k: 0 }; animBtn.textContent = 'Animating…'; }, true, 'anim']]);
      animBtn = ab.querySelector('#anim');
      return [
        h('h4', {}, 'The filter: 9 weights, edit any of them'),
        h('div', { class: 'kernel' }, inputs),
        buttons(Object.entries(KERNELS).map(([n, k]) => [n, () => setK(k)])),
        ab,
        h('h4', {}, 'Drawing'),
        buttons([['Seven', () => { sample('seven'); redraw(); }], ['Ring', () => { sample('ring'); redraw(); }], ['House', () => { sample('house'); redraw(); }], ['Clear', () => { img.fill(0); redraw(); }]]),
        h('p', { class: 'small' }, 'In the feature map, blue means the filter matched and orange means the opposite pattern. Right-click or hold Shift to erase.'),
      ];
    },
  };
}

// ======================================================================
// Chapters and app shell
// ======================================================================
const CHAPTERS = [
  { id: 'neuron', name: 'One neuron', sub: 'Multiply, add, squash', make: chapterNeuron,
    what: 'A neuron takes a number, multiplies it by a weight, adds a bias, and passes the result through an activation function that squashes or bends it. That’s all. The weight sets how steep the response is and which way it faces; the bias slides it left or right.',
    tip: 'Set the activation to Step and drag the bias: the neuron becomes a switch that flips at a point you choose.' },
  { id: 'line', name: 'A neuron draws a line', sub: 'Two inputs, one decision', make: chapterLine,
    what: 'With two inputs, the neuron looks at a point (x₁, x₂). The weights and bias define a straight line across the plane: on one side the sum is positive and the neuron says blue, on the other it says orange. Changing the weights turns the line; changing the bias slides it.',
    tip: 'Try to sort every dot correctly by hand. Then make the weights larger without changing their ratio: the line stays put but the answer gets more confident.' },
  { id: 'learn', name: 'How it learns', sub: 'Rolling downhill on the error', make: chapterLearn,
    what: 'Instead of tuning weights by hand, the network measures how wrong it is (the error) and nudges each weight in the direction that lowers it. The error surface shows the error for every possible pair of weights; learning is a ball rolling downhill on it. The learning rate is the size of each step.',
    tip: 'Set the learning rate very high (above 10) and watch it overshoot. Set it very low and it crawls. Click the surface to drop the ball somewhere new.' },
  { id: 'hidden', name: 'One line isn’t enough', sub: 'Hidden neurons combine lines', make: chapterHidden,
    what: 'A single neuron can only draw one straight line, so it can’t separate XOR or a circle. Add a hidden layer and each hidden neuron draws its own line; the output neuron then combines them into bends, corners and enclosed regions. The small squares show what each neuron has learned to respond to.',
    tip: 'Pick XOR with 0 hidden neurons: it gets stuck near 50%. Slide to 2 or 3 hidden neurons and watch it solve the puzzle.' },
  { id: 'curves', name: 'Building any curve', sub: 'A sum of simple pieces', make: chapterCurves,
    what: 'Networks can fit curves too. With ReLU, each hidden neuron contributes a piece that is flat and then bends into a straight ramp. Adding pieces with different bend points and slopes builds up almost any shape, a little like bending a wire at several places. More neurons means more bends.',
    tip: 'Choose Draw your own, sketch something wild, and compare 3 neurons with 20.' },
  { id: 'play', name: 'The playground', sub: 'Stack layers, watch it learn', make: chapterPlayground,
    what: 'Now everything together. Each layer builds on the one before: the first layer draws lines, later layers combine them into more and more complex shapes. The hollow test dots are held back from training, so they show whether the network has learned the pattern or just memorized the dots it saw.',
    tip: 'Try the spiral with 0 hidden layers, then 1, then 3. Then turn on extra inputs and solve the circle with no hidden layer at all.' },
  { id: 'conv', name: 'How networks see', sub: 'Filters that find edges', make: chapterConv,
    what: 'Image networks don’t look at the whole picture at once. They slide a small filter, here 3×3 weights, across the image, computing a weighted sum at every position. A filter that weights the right side positive and the left side negative lights up wherever brightness changes from left to right: a vertical edge. ReLU keeps the matches; pooling shrinks the map so the next layer can look at bigger patterns.',
    tip: 'Pick Vertical edges, then draw a horizontal line: the feature map stays dark. Real networks learn their filter weights instead of having them typed in.' },
];
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
let cur = null, active = null;

function buildCatalog() {
  $('#catalog').replaceChildren(...CHAPTERS.map((c, i) => h('button', { class: 'item', 'data-id': c.id, onclick: () => select(c.id) }, h('span', { class: 'n' }, String(i + 1).padStart(2, '0')), h('b', {}, c.name), h('span', {}, c.sub))));
}
function select(id) {
  cur = byId[id] || CHAPTERS[0];
  active?.dispose?.();
  panes.length = 0; $('#panes').replaceChildren();
  active = cur.make();
  for (const b of document.querySelectorAll('.item')) b.setAttribute('aria-current', b.dataset.id === cur.id ? 'true' : 'false');
  try { history.replaceState(null, '', '#' + cur.id); } catch (e) {}
  const n = CHAPTERS.indexOf(cur) + 1;
  $('#info').replaceChildren(
    h('span', { class: 'eyebrow' }, `Chapter ${n} of ${CHAPTERS.length}`),
    h('h2', {}, cur.name),
    h('h4', {}, 'What’s happening'), h('p', {}, cur.what),
    h('p', { class: 'tip', html: '<b>Try this:</b> ' + cur.tip }),
    n < CHAPTERS.length ? h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => select(CHAPTERS[n].id) }, `Next: ${CHAPTERS[n].name} →`)) : null);
  $('#controls').replaceChildren(h('h4', {}, 'Controls'), ...active.ui());
  requestAnimationFrame(() => { panes.forEach(p => p.fit()); active.redraw(); });
}
new ResizeObserver(() => { if (!active) return; panes.forEach(p => p.fit()); active.redraw(); }).observe($('#panes'));
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  active?.tick?.(dt);
}
buildCatalog();
const boot = () => { const id = location.hash.slice(1); select(byId[id] ? id : 'neuron'); requestAnimationFrame(tick); };
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(boot);
// Debug hook: step chapters without animation frames
window.__nn = { select, get active() { return active; }, step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) active?.tick?.(dt); active.redraw(); } };
</script>
